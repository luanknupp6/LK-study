{id:'bgp',n:'BGP · Parte 1',q:1,d:'Conceitos do BGP e eBGP básico: como a internet troca rotas entre redes.',
 t:`<div class="card"><h3>1. O que é BGP e por que existe</h3><p>A internet é um conjunto de milhares de redes independentes (provedores, empresas, universidades). Cada uma é um <b>AS</b> (Autonomous System, ou Sistema Autônomo). Dentro de um AS, usa-se um protocolo interno como o OSPF. <b>Entre</b> ASs, usa-se o <b>BGP</b> (Border Gateway Protocol, versão 4).</p><ul><li>Ele é o protocolo que sustenta a internet: a tabela global tem cerca de 1 milhão de prefixos IPv4.</li><li>Roda sobre <b>TCP porta 179</b> e os vizinhos são <b>configurados manualmente</b> (não há descoberta automática).</li><li>É um protocolo de <b>vetor de caminho</b> (path vector): cada rota carrega a lista de ASs pelos quais passou.</li><li>Escolhe caminhos por <b>política</b> (quem eu prefiro, quem eu pago, quem é meu cliente), e não só por custo.</li></ul></div>
<div class="card"><h3>2. AS e ASN</h3><p>O <b>ASN</b> identifica o AS. Pode ter 16 bits (1 a 65535) ou 32 bits. Faixas privadas (como o 192.168 do IP): <b>64512–65534</b> (16 bits) e 4200000000–4294967294 (32 bits). ASNs públicos são distribuídos por registros: no Brasil, o <b>Registro.br</b>, ligado ao LACNIC (registro regional da América Latina). Um provedor com ASN próprio e blocos IP próprios consegue anunciar sua rede para vários provedores de tráfego (<b>multihoming</b>), ganhando redundância.</p></div>
<div class="card"><h3>3. Como os ASs se relacionam</h3><svg viewBox='0 0 560 190' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><line x1='280' y1='60' x2='160' y2='125'/><line x1='280' y1='60' x2='400' y2='125'/><line x1='210' y1='150' x2='350' y2='150' stroke-dasharray='6 5'/><rect x='215' y='25' width='130' height='40' rx='6' fill='var(--ac)'/><rect x='95' y='125' width='130' height='40' rx='6' fill='var(--ac2)'/><rect x='335' y='125' width='130' height='40' rx='6' fill='var(--ac2)'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='280' y='50' fill='#fff' font-weight='700'>Seu AS (cliente)</text><text x='160' y='150'>Upstream A</text><text x='400' y='150'>Upstream B</text><text x='280' y='143' font-size='11'>peering</text><text x='205' y='90' font-size='11'>trânsito</text><text x='355' y='90' font-size='11'>trânsito</text></g></svg><table><tr><th>Relação</th><th>O que é</th></tr><tr><td>Cliente–provedor (trânsito)</td><td>Você paga para ter acesso a toda a internet</td></tr><tr><td>Peering</td><td>Dois ASs trocam entre si apenas o tráfego dos seus clientes, geralmente sem custo</td></tr><tr><td>IX (PTT)</td><td>Local onde muitos ASs fazem peering. No Brasil, o IX.br</td></tr></table></div>
<div class="card"><h3>4. eBGP e iBGP</h3><table><tr><th></th><th>eBGP</th><th>iBGP</th></tr><tr><td>Entre</td><td>ASs diferentes</td><td>Roteadores do mesmo AS</td></tr><tr><td>AD (Cisco)</td><td>20</td><td>200</td></tr><tr><td>TTL padrão</td><td>1 (vizinho diretamente conectado)</td><td>255</td></tr><tr><td>Papel</td><td>Trocar rotas com outros ASs</td><td>Espalhar as rotas externas dentro do AS</td></tr></table><p>Esta parte 1 foca no <b>eBGP</b>. O iBGP e suas regras (full mesh, route reflector, next-hop-self) ficam para a parte 2.</p></div>
<div class="card"><h3>5. As 4 mensagens do BGP</h3><table><tr><th>Mensagem</th><th>Função</th></tr><tr><td>OPEN</td><td>Inicia a sessão: informa ASN, router-id, hold time e capacidades</td></tr><tr><td>KEEPALIVE</td><td>Mantém a sessão viva (padrão 60 s; hold time de 180 s)</td></tr><tr><td>UPDATE</td><td>Anuncia ou retira prefixos, junto com seus atributos</td></tr><tr><td>NOTIFICATION</td><td>Informa um erro e derruba a sessão</td></tr></table></div>
<div class="card"><h3>6. Estados da sessão e onde ela trava</h3><table><tr><th>Estado</th><th>Significado</th><th>Se ficar parado</th></tr><tr><td>Idle</td><td>Sem tentativa de conexão</td><td>Vizinho mal configurado ou interface down</td></tr><tr><td>Connect / Active</td><td>Tentando abrir o TCP 179</td><td>Sem rota para o vizinho, ACL bloqueando, IP errado, o outro lado sem neighbor</td></tr><tr><td>OpenSent / OpenConfirm</td><td>OPEN trocado</td><td>ASN, router-id ou autenticação incompatíveis</td></tr><tr><td>Established</td><td>Sessão ativa, trocando UPDATEs</td><td>Estado correto</td></tr></table><div class="tip">Dica de NOC: “Active” não significa funcionando. É o estado de quem ainda tenta conectar. O funcionamento certo é sempre <b>Established</b>.</div></div>
<div class="card"><h3>7. Atributos e escolha do melhor caminho</h3><p>Cada prefixo anunciado carrega <b>atributos</b>:</p><ul><li><b>AS_PATH:</b> lista dos ASs atravessados. Serve para evitar loops (se o seu ASN já está no caminho, a rota é descartada) e, quanto mais curto, melhor.</li><li><b>NEXT_HOP:</b> o IP do próximo salto para chegar ao prefixo.</li><li><b>ORIGIN:</b> como a rota entrou no BGP (IGP, EGP ou incomplete).</li><li><b>LOCAL_PREF:</b> preferência de saída dentro do AS (maior vence).</li><li><b>MED:</b> sugestão ao vizinho sobre qual entrada usar (menor vence).</li><li><b>Community:</b> etiquetas para aplicar políticas.</li></ul><p><b>Ordem simplificada de decisão (Cisco):</b> weight (local, só na Cisco) → maior LOCAL_PREF → rota originada localmente → menor AS_PATH → menor ORIGIN → menor MED → eBGP antes de iBGP → menor custo IGP até o next hop → menor router-id. Na Huawei, o equivalente do weight é o <b>preferred-value</b>. A parte 2 aprofunda isso.</p></div>
<div class="card"><h3>8. Como anunciar prefixos</h3><ul><li>O comando <b>network</b> anuncia um prefixo <b>somente se ele existir exatamente igual na tabela de rotas</b>. Para anunciar um bloco agregado, é comum criar uma rota estática para <b>Null0</b>.</li><li>Na internet, em geral são aceitos prefixos IPv4 até <b>/24</b> e IPv6 até <b>/48</b>; mais específicos costumam ser filtrados.</li><li>Nunca anuncie o que não é seu: use sempre <b>prefix-list</b> e <b>route-map</b> (Cisco) ou <b>ip-prefix</b> e <b>route-policy</b> (Huawei).</li></ul></div>
<div class="card"><h3>9. Segurança básica de BGP</h3><ul><li><b>Hijack e vazamento de rotas:</b> um AS anuncia prefixos que não são dele (por erro ou má-fé) e desvia ou derruba tráfego. Já causaram grandes quedas de serviços na internet.</li><li><b>Defesas:</b> filtros de entrada e saída, limite máximo de prefixos por vizinho, senha na sessão, e <b>RPKI/ROV</b>, que valida quem tem autorização para originar cada prefixo.</li><li><b>MANRS:</b> iniciativa de boas práticas de segurança de roteamento adotada por muitos provedores.</li></ul></div>
<div class="card"><h3>10. Comandos de verificação</h3><table><tr><th>Objetivo</th><th>Cisco</th><th>Huawei</th></tr><tr><td>Estado dos vizinhos</td><td>show ip bgp summary</td><td>display bgp peer</td></tr><tr><td>Tabela BGP</td><td>show ip bgp</td><td>display bgp routing-table</td></tr><tr><td>Detalhe de um vizinho</td><td>show ip bgp neighbors X</td><td>display bgp peer X verbose</td></tr><tr><td>Rotas BGP na tabela de rotas</td><td>show ip route bgp</td><td>display ip routing-table protocol bgp</td></tr></table></div>
<div class="card"><h3>Resumo</h3><ul><li>BGP liga ASs; OSPF fica dentro do AS.</li><li>TCP 179, vizinhos manuais, mensagens OPEN, KEEPALIVE, UPDATE e NOTIFICATION.</li><li>Estado correto = Established.</li><li>AS_PATH evita loop e ajuda na escolha. Sempre filtre o que entra e o que sai.</li></ul></div>`,
 l:{about:'Dois roteadores em ASs diferentes (R1 no AS 65001 e R2 no AS 65002), cada um com um PC. Os níveis sobem da sessão eBGP até anúncio de prefixos, sessão pelas loopbacks, filtros e segurança, e falhas provocadas.',topo:[],svg:`<svg viewBox='0 0 560 150' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><rect x='25' y='15' width='215' height='100' rx='10' fill='none' stroke-dasharray='6 5'/><rect x='320' y='15' width='215' height='100' rx='10' fill='none' stroke-dasharray='6 5'/><line x1='185' y1='65' x2='375' y2='65' stroke-width='3'/><line x1='60' y1='65' x2='115' y2='65'/><line x1='445' y1='65' x2='500' y2='65'/><circle cx='150' cy='65' r='30' fill='var(--ac2)'/><circle cx='410' cy='65' r='30' fill='var(--ac2)'/><rect x='5' y='47' width='55' height='36' rx='6' fill='none'/><rect x='500' y='47' width='55' height='36' rx='6' fill='none'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='150' y='70' font-weight='700'>R1</text><text x='410' y='70' font-weight='700'>R2</text><text x='32' y='70'>PC1</text><text x='527' y='70'>PC2</text><text x='125' y='32'>AS 65001</text><text x='430' y='32'>AS 65002</text><text x='280' y='55' font-size='11'>eBGP · 10.0.12.0/30</text><text x='280' y='135' font-size='11'>LAN A 192.168.1.0/24 · LAN B 192.168.2.0/24 · bloco 172.16.0.0/16 (R1)</text></g></svg>`,
 pre:`<ul><li><b>Equipamentos:</b> 2 roteadores (Cisco CSR1000v ou IOSv; Huawei AR ou NE virtual) e 2 PCs (VPCS). Tempo estimado: cerca de 60 minutos.</li></ul><div class="tip" style="border-left-color:var(--er)"><b>Atenção:</b> o BGP pode levar de alguns segundos até cerca de 1 minuto para subir. Não se assuste se o estado ficar em Idle ou Active no começo: espere e repita o comando de verificação. Na Huawei, a sintaxe do BGP muda entre versões do VRP; os avisos nos passos indicam onde.</div><table><tr><th>Ligação</th><th>Porta A</th><th>Porta B</th></tr><tr><td>R1 ↔ R2</td><td>R1 g0/0</td><td>R2 g0/0</td></tr><tr><td>PC1</td><td>R1 g0/1</td><td>PC1</td></tr><tr><td>PC2</td><td>R2 g0/1</td><td>PC2</td></tr></table><table><tr><th>Equipamento</th><th>Interfaces</th><th>Endereços</th></tr><tr><td>R1 (AS 65001)</td><td>Lo0 · g0/0 · g0/1</td><td>1.1.1.1/32 · 10.0.12.1/30 · 192.168.1.1/24</td></tr><tr><td>R2 (AS 65002)</td><td>Lo0 · g0/0 · g0/1</td><td>2.2.2.2/32 · 10.0.12.2/30 · 192.168.2.1/24</td></tr><tr><td>PC1</td><td>—</td><td>192.168.1.10/24 · gw 192.168.1.1</td></tr><tr><td>PC2</td><td>—</td><td>192.168.2.10/24 · gw 192.168.2.1</td></tr></table><p>Nos roteadores Huawei, g0/0 é GigabitEthernet0/0/0 e assim por diante. <b>Como zerar:</b> Cisco <code>write erase</code> e <code>reload</code>; Huawei <code>reset saved-configuration</code> e <code>reboot</code>. Cada passo indica o equipamento no título; o <b>gabarito</b> traz a configuração final dos dois roteadores.</p>`,
 s:[{t:'Nível 1 · PCs: IP e gateway (VPCS)',c:[['PC1> ip 192.168.1.10/24 192.168.1.1','PC1> ip 192.168.1.10/24 192.168.1.1','IP, máscara e gateway do PC1'],['PC2> ip 192.168.2.10/24 192.168.2.1','PC2> ip 192.168.2.10/24 192.168.2.1','IP, máscara e gateway do PC2']]},
{t:'Nível 1 · R1: nome e endereços',w:'Os nomes das interfaces variam por imagem: confira com show ip interface brief (display ip interface brief). Na Huawei, as portas costumam já vir ativas.',c:[['hostname R1','sysname R1','Nome do roteador'],['interface loopback0','interface LoopBack0','Cria a loopback (usada no nível 3)'],['ip address 1.1.1.1 255.255.255.255','ip address 1.1.1.1 32','IP /32 da loopback'],['interface g0/0','interface GigabitEthernet0/0/0','Interface que liga ao R2'],['ip address 10.0.12.1 255.255.255.252','ip address 10.0.12.1 30','IP /30 do enlace R1–R2'],['no shutdown','undo shutdown','Ativa a interface'],['interface g0/1','interface GigabitEthernet0/0/1','Interface da LAN A'],['ip address 192.168.1.1 255.255.255.0','ip address 192.168.1.1 24','Gateway do PC1'],['no shutdown','undo shutdown','Ativa a interface']]},
{t:'Nível 1 · R2: nome e endereços',c:[['hostname R2','sysname R2','Nome do roteador'],['interface loopback0','interface LoopBack0','Cria a loopback'],['ip address 2.2.2.2 255.255.255.255','ip address 2.2.2.2 32','IP /32 da loopback do R2'],['interface g0/0','interface GigabitEthernet0/0/0','Interface que liga ao R1'],['ip address 10.0.12.2 255.255.255.252','ip address 10.0.12.2 30','IP /30 do enlace R1–R2 (lado do R2)'],['no shutdown','undo shutdown','Ativa a interface'],['interface g0/1','interface GigabitEthernet0/0/1','Interface da LAN B'],['ip address 192.168.2.1 255.255.255.0','ip address 192.168.2.1 24','Gateway do PC2'],['no shutdown','undo shutdown','Ativa a interface']],x:'No R1, o ping ao 10.0.12.2 responde. Se falhar, confira o cabo (g0/0 com g0/0) e o estado das interfaces.'},
{t:'Nível 1 · R1: sessão eBGP',w:'O ASN do vizinho precisa estar exato: um número errado impede a sessão. Na Huawei, em algumas versões é preciso habilitar o vizinho na família IPv4 (ipv4-family unicast, peer 10.0.12.2 enable); em outras, já vem habilitado.',c:[['router bgp 65001','bgp 65001','Cria o processo BGP no AS 65001'],['bgp router-id 1.1.1.1','router-id 1.1.1.1','Fixa o router-id'],['neighbor 10.0.12.2 remote-as 65002','peer 10.0.12.2 as-number 65002','Define o vizinho eBGP (R2, AS 65002)']]},
{t:'Nível 1 · R2: sessão eBGP',c:[['router bgp 65002','bgp 65002','Cria o processo BGP no AS 65002'],['bgp router-id 2.2.2.2','router-id 2.2.2.2','Fixa o router-id'],['neighbor 10.0.12.1 remote-as 65001','peer 10.0.12.1 as-number 65001','Define o vizinho eBGP (R1, AS 65001)']]},
{t:'Nível 1 · Verificar a sessão',c:[['show ip bgp summary','display bgp peer','Mostra o estado da sessão com o vizinho']],x:'A sessão fica em Established (na Cisco, a coluna State/PfxRcd mostra um número; na Huawei, o estado aparece como Established). Se ficar em Active ou Idle por mais de 1 minuto, confira o IP e o ASN do vizinho.'},
{t:'Nível 2 · R1: anunciar prefixos',w:'O comando network só anuncia um prefixo que exista exatamente igual na tabela de rotas. Por isso o bloco 172.16.0.0/16 precisa de uma rota para Null0 antes. Na Huawei, em versões com famílias de endereço, o network fica dentro de ipv4-family unicast.',c:[['router bgp 65001','bgp 65001','Entra no processo BGP'],['network 192.168.1.0 mask 255.255.255.0','network 192.168.1.0 24','Anuncia a LAN A'],['ip route 172.16.0.0 255.255.0.0 null0','(fora do BGP) ip route-static 172.16.0.0 16 NULL0','Cria a rota de suporte para o bloco do provedor'],['network 172.16.0.0 mask 255.255.0.0','network 172.16.0.0 16','Anuncia o bloco agregado']]},
{t:'Nível 2 · R2: anunciar a LAN B',c:[['router bgp 65002','bgp 65002','Entra no processo BGP'],['network 192.168.2.0 mask 255.255.255.0','network 192.168.2.0 24','Anuncia a LAN B']]},
{t:'Nível 2 · Verificar',c:[['show ip bgp','display bgp routing-table','Tabela BGP (no R2 e no R1)'],['show ip route bgp','display ip routing-table protocol bgp','Rotas BGP na tabela de rotas'],['PC1> ping 192.168.2.10','PC1> ping 192.168.2.10','Teste do PC1 ao PC2']],x:'No R2, aparecem 192.168.1.0/24 e 172.16.0.0/16 com AS_PATH 65001, e as rotas entram na tabela como B (AD 20 na Cisco). No R1, aparece 192.168.2.0/24 com AS_PATH 65002. O ping do PC1 ao PC2 responde.'},
{t:'Nível 3 · R1: sessão pela loopback',w:'O eBGP tem TTL 1: pela loopback, o vizinho está a 2 saltos lógicos e precisa de multihop. Os dois roteadores precisam ter rota para a loopback um do outro e usar update-source. Primeiro crie o novo vizinho e confirme Established; só depois remova o antigo.',c:[['ip route 2.2.2.2 255.255.255.255 10.0.12.2','ip route-static 2.2.2.2 32 10.0.12.2','Rota para a loopback do R2'],['router bgp 65001','bgp 65001','Entra no processo BGP'],['neighbor 2.2.2.2 remote-as 65002','peer 2.2.2.2 as-number 65002','Novo vizinho, pela loopback'],['neighbor 2.2.2.2 update-source loopback0','peer 2.2.2.2 connect-interface LoopBack0','A origem da sessão passa a ser a loopback'],['neighbor 2.2.2.2 ebgp-multihop 2','peer 2.2.2.2 ebgp-max-hop 2','Permite o TTL 2 no eBGP']]},
{t:'Nível 3 · R2: sessão pela loopback',c:[['ip route 1.1.1.1 255.255.255.255 10.0.12.1','ip route-static 1.1.1.1 32 10.0.12.1','Rota para a loopback do R1'],['router bgp 65002','bgp 65002','Entra no processo BGP'],['neighbor 1.1.1.1 remote-as 65001','peer 1.1.1.1 as-number 65001','Novo vizinho, pela loopback'],['neighbor 1.1.1.1 update-source loopback0','peer 1.1.1.1 connect-interface LoopBack0','A origem da sessão é a loopback'],['neighbor 1.1.1.1 ebgp-multihop 2','peer 1.1.1.1 ebgp-max-hop 2','Permite o TTL 2 no eBGP']]},
{t:'Nível 3 · Confirmar e remover o vizinho antigo',w:'Remova o vizinho antigo só depois de ver a sessão pela loopback em Established. Se remover antes, as rotas somem até a nova sessão subir.',c:[['show ip bgp summary','display bgp peer','Confirma Established com a loopback'],['no neighbor 10.0.12.2 remote-as 65002','undo peer 10.0.12.2','R1: remove o vizinho antigo (no R2: o 10.0.12.1)'],['PC1> ping 192.168.2.10','PC1> ping 192.168.2.10','O ping continua respondendo']],x:'Fica um único vizinho, 2.2.2.2 no R1 e 1.1.1.1 no R2, em Established. As rotas BGP continuam na tabela e o ping do PC1 ao PC2 responde.'},
{t:'Nível 4 · R1: filtro de saída',w:'Use o IP do vizinho que está em uso (2.2.2.2, se você fez o nível 3). A prefix-list e a ip-prefix têm um deny implícito no fim: só passa o que estiver na lista. Depois de aplicar uma política nova, reaplique sem derrubar a sessão (clear ip bgp * soft out ou refresh bgp all export).',c:[['ip prefix-list ANUNCIAR seq 10 permit 192.168.1.0/24','ip ip-prefix ANUNCIAR index 10 permit 192.168.1.0 24','Permite a LAN A'],['ip prefix-list ANUNCIAR seq 20 permit 172.16.0.0/16','ip ip-prefix ANUNCIAR index 20 permit 172.16.0.0 16','Permite o bloco do provedor'],['route-map SAIDA permit 10','route-policy SAIDA permit node 10','Cria a política de saída'],['match ip address prefix-list ANUNCIAR','if-match ip-prefix ANUNCIAR','Só passa o que estiver na lista'],['router bgp 65001','bgp 65001','Entra no processo BGP'],['neighbor 2.2.2.2 route-map SAIDA out','peer 2.2.2.2 route-policy SAIDA export','Aplica a política na saída'],['clear ip bgp * soft out','refresh bgp all export','Reaplica sem derrubar a sessão']]},
{t:'Nível 4 · R1: testar o filtro com um prefixo fora da lista',c:[['ip route 10.99.99.0 255.255.255.0 null0','ip route-static 10.99.99.0 24 NULL0','Cria um prefixo de teste'],['router bgp 65001 / network 10.99.99.0 mask 255.255.255.0','bgp 65001 / network 10.99.99.0 24','Tenta anunciar o prefixo de teste'],['show ip bgp (no R2)','display bgp routing-table (no R2)','Confere se o R2 recebeu'],['no network 10.99.99.0 mask 255.255.255.0','undo network 10.99.99.0 24','Remove o prefixo de teste no fim']],x:'O prefixo 10.99.99.0/24 existe no R1, mas não aparece no R2, porque o filtro de saída só libera as duas redes da lista. Depois do teste, remova-o.'},
{t:'Nível 4 · R1 e R2: senha e limite de prefixos',w:'A senha precisa ser igual nos dois lados e as duas pontas devem ser configuradas em sequência: com só um lado, a sessão cai até o outro ser configurado. Na Huawei, o password cipher aceita a senha em texto, e ela fica criptografada na configuração.',c:[['R1: neighbor 2.2.2.2 password SENHA123','R1: peer 2.2.2.2 password cipher SENHA123','Autentica a sessão no R1'],['R2: neighbor 1.1.1.1 password SENHA123','R2: peer 1.1.1.1 password cipher SENHA123','Mesma senha no R2'],['R1: neighbor 2.2.2.2 maximum-prefix 100','R1: peer 2.2.2.2 route-limit 100','Limita quantos prefixos o R2 pode mandar'],['R2: neighbor 1.1.1.1 maximum-prefix 100','R2: peer 1.1.1.1 route-limit 100','Mesmo limite no R2']],x:'A sessão cai por alguns segundos enquanto só um lado tem a senha, e volta a Established depois que o segundo lado é configurado.'},
{t:'Nível 5 · Falhas provocadas',w:'Faça uma falha de cada vez e corrija antes da próxima. Use o IP do vizinho que está em uso (2.2.2.2 no R1, se você fez o nível 3).',c:[['R1: neighbor 2.2.2.2 remote-as 65099','R1: peer 2.2.2.2 as-number 65099','Falha 1: ASN errado. A sessão não sobe; compare o estado e o ASN configurado'],['R1: neighbor 2.2.2.2 remote-as 65002','R1: peer 2.2.2.2 as-number 65002','Corrige a Falha 1'],['R1: interface g0/0 / shutdown','R1: interface GigabitEthernet0/0/0 / shutdown','Falha 2: enlace caído. A sessão cai e as rotas BGP somem'],['R1: interface g0/0 / no shutdown','R1: interface GigabitEthernet0/0/0 / undo shutdown','Corrige a Falha 2'],['R2: router bgp 65002 / no network 192.168.2.0 mask 255.255.255.0','R2: bgp 65002 / undo network 192.168.2.0 24','Falha 3: o R2 deixa de anunciar a LAN B. O R1 perde a rota'],['show ip bgp neighbors 2.2.2.2','display bgp peer 2.2.2.2 verbose','Detalha estado, ASN, timers e o último erro']],x:'Falha 1: o estado fica em Idle/Active e o log mostra o ASN divergente. Falha 2: a sessão cai e as rotas BGP desaparecem das duas tabelas. Falha 3: a sessão continua Established, mas o 192.168.2.0/24 some do R1. Corrija desfazendo o comando.'}],
 gab:{cisco:`<h4>R1</h4><pre class='gb'>hostname R1
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 192.168.1.1 255.255.255.0
 no shutdown
ip route 2.2.2.2 255.255.255.255 10.0.12.2
ip route 172.16.0.0 255.255.0.0 Null0
ip prefix-list ANUNCIAR seq 10 permit 192.168.1.0/24
ip prefix-list ANUNCIAR seq 20 permit 172.16.0.0/16
route-map SAIDA permit 10
 match ip address prefix-list ANUNCIAR
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 2.2.2.2 remote-as 65002
 neighbor 2.2.2.2 ebgp-multihop 2
 neighbor 2.2.2.2 update-source Loopback0
 neighbor 2.2.2.2 password SENHA123
 neighbor 2.2.2.2 maximum-prefix 100
 neighbor 2.2.2.2 route-map SAIDA out
 network 192.168.1.0 mask 255.255.255.0
 network 172.16.0.0 mask 255.255.0.0</pre><h4>R2</h4><pre class='gb'>hostname R2
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.12.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 192.168.2.1 255.255.255.0
 no shutdown
ip route 1.1.1.1 255.255.255.255 10.0.12.1
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 1.1.1.1 remote-as 65001
 neighbor 1.1.1.1 ebgp-multihop 2
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 1.1.1.1 password SENHA123
 neighbor 1.1.1.1 maximum-prefix 100
 network 192.168.2.0 mask 255.255.255.0</pre>`,huawei:`<h4>R1</h4><pre class='gb'>sysname R1
interface LoopBack0
 ip address 1.1.1.1 32
interface GigabitEthernet0/0/0
 ip address 10.0.12.1 30
interface GigabitEthernet0/0/1
 ip address 192.168.1.1 24
ip route-static 2.2.2.2 32 10.0.12.2
ip route-static 172.16.0.0 16 NULL0
ip ip-prefix ANUNCIAR index 10 permit 192.168.1.0 24
ip ip-prefix ANUNCIAR index 20 permit 172.16.0.0 16
route-policy SAIDA permit node 10
 if-match ip-prefix ANUNCIAR
bgp 65001
 router-id 1.1.1.1
 peer 2.2.2.2 as-number 65002
 peer 2.2.2.2 ebgp-max-hop 2
 peer 2.2.2.2 connect-interface LoopBack0
 peer 2.2.2.2 password cipher SENHA123
 peer 2.2.2.2 route-limit 100
 peer 2.2.2.2 route-policy SAIDA export
 network 192.168.1.0 24
 network 172.16.0.0 16</pre><h4>R2</h4><pre class='gb'>sysname R2
interface LoopBack0
 ip address 2.2.2.2 32
interface GigabitEthernet0/0/0
 ip address 10.0.12.2 30
interface GigabitEthernet0/0/1
 ip address 192.168.2.1 24
ip route-static 1.1.1.1 32 10.0.12.1
bgp 65002
 router-id 2.2.2.2
 peer 1.1.1.1 as-number 65001
 peer 1.1.1.1 ebgp-max-hop 2
 peer 1.1.1.1 connect-interface LoopBack0
 peer 1.1.1.1 password cipher SENHA123
 peer 1.1.1.1 route-limit 100
 network 192.168.2.0 24</pre>`}},
 lOld:{about:'Dois roteadores em ASs diferentes: R1 no AS 65001 e R2 no AS 65002, ligados por 10.0.12.0/30 (R1 .1, R2 .2). LAN do R1: 192.168.1.0/24; LAN do R2: 192.168.2.0/24. Loopbacks: R1 1.1.1.1 e R2 2.2.2.2. Sempre repita a configuração espelhada no R2.',topo:[],svg:`<svg viewBox='0 0 560 140' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><rect x='25' y='15' width='200' height='95' rx='10' fill='none' stroke-dasharray='6 5'/><rect x='335' y='15' width='200' height='95' rx='10' fill='none' stroke-dasharray='6 5'/><line x1='185' y1='65' x2='375' y2='65' stroke-width='3'/><circle cx='155' cy='65' r='30' fill='var(--ac2)'/><circle cx='405' cy='65' r='30' fill='var(--ac2)'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='155' y='70' font-weight='700'>R1</text><text x='405' y='70' font-weight='700'>R2</text><text x='125' y='32'>AS 65001</text><text x='435' y='32'>AS 65002</text><text x='280' y='55' font-size='11'>eBGP · 10.0.12.0/30</text><text x='70' y='95' font-size='11'>LAN 192.168.1.0/24</text><text x='480' y='95' font-size='11'>LAN 192.168.2.0/24</text></g></svg>`,
 s:[{t:'Nível 1 · Sessão eBGP',c:[['interface g0/0 / ip address 10.0.12.1 255.255.255.252 / no shutdown','interface GigabitEthernet0/0/0 / ip address 10.0.12.1 30','R1: enlace com o R2 (o R2 usa 10.0.12.2)'],['router bgp 65001','bgp 65001','R1: cria o processo BGP no AS 65001 (o R2 usa 65002)'],['bgp router-id 1.1.1.1','router-id 1.1.1.1','Fixa o router-id'],['neighbor 10.0.12.2 remote-as 65002','peer 10.0.12.2 as-number 65002','Define o vizinho eBGP (faça o espelho no R2)'],['show ip bgp summary','display bgp peer','Procure Established (a Cisco mostra também o número de prefixos recebidos)']]},
{t:'Nível 2 · Anunciar prefixos',c:[['interface g0/1 / ip address 192.168.1.1 255.255.255.0','interface GigabitEthernet0/0/1 / ip address 192.168.1.1 24','R1: interface da LAN (o R2 usa 192.168.2.1/24)'],['network 192.168.1.0 mask 255.255.255.0','network 192.168.1.0 24','Dentro do router bgp: anuncia a LAN (na Huawei, em versões com famílias, entre antes em ipv4-family unicast)'],['ip route 172.16.0.0 255.255.0.0 null0','ip route-static 172.16.0.0 16 NULL0','Rota para Null0 que sustenta o anúncio de um bloco agregado'],['network 172.16.0.0 mask 255.255.0.0','network 172.16.0.0 16','Anuncia o agregado do provedor'],['show ip bgp','display bgp routing-table','No R2: veja os prefixos do R1 e o AS_PATH 65001'],['show ip route bgp','display ip routing-table protocol bgp','No R2: as rotas aparecem como B (AD 20 na Cisco)']]},

 t:`<div class="card"><h3>1. iBGP: levando as rotas para dentro do AS</h3><p>Um roteador de borda aprende rotas externas por <b>eBGP</b>. Os demais roteadores do AS também precisam delas para encaminhar o tráfego. O <b>iBGP</b> faz esse papel.</p><ul><li>Sessão entre roteadores do <b>mesmo ASN</b>.</li><li>Não altera o AS_PATH; AD 200 na Cisco.</li><li>Normalmente feito <b>pelas loopbacks</b>, apoiado num IGP (OSPF ou IS-IS) que leva as loopbacks e os enlaces internos.</li></ul><div class="tip">Divisão clássica de provedor: o <b>IGP</b> carrega a infraestrutura (loopbacks e enlaces); o <b>iBGP</b> carrega os prefixos de clientes e da internet.</div></div>
<div class="card"><h3>2. A regra do iBGP e o full mesh</h3><p>Uma rota aprendida de um vizinho iBGP <b>não é repassada a outro vizinho iBGP</b>. Como o iBGP não muda o AS_PATH, essa regra é a única proteção contra loop dentro do AS. A consequência é que todos os roteadores iBGP precisam estar ligados a todos: o <b>full mesh</b>, com N×(N−1)/2 sessões.</p><table><tr><th>Roteadores</th><th>Sessões</th></tr><tr><td>5</td><td>10</td></tr><tr><td>10</td><td>45</td></tr><tr><td>20</td><td>190</td></tr><tr><td>100</td><td>4950</td></tr></table></div>
<div class="card"><h3>3. Route reflector (RR)</h3><p>O <b>route reflector</b> é uma exceção à regra: ele pode repassar rotas de um vizinho iBGP a outros. Os roteadores ligados a ele são <b>clientes</b>; cada cliente precisa de sessão só com o RR, e não com todos.</p><ul><li>Atributos <b>ORIGINATOR_ID</b> e <b>CLUSTER_LIST</b> impedem loops.</li><li>Em produção usa-se <b>mais de um RR</b> (redundância), no mesmo cluster.</li><li>Alternativa menos comum: <b>confederações</b> (dividir o AS em sub-ASs).</li></ul></div>
<div class="card"><h3>4. O problema do next hop</h3><svg viewBox='0 0 560 120' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><line x1='95' y1='55' x2='215' y2='55'/><line x1='305' y1='55' x2='415' y2='55' stroke-dasharray='6 5'/><rect x='215' y='30' width='90' height='50' rx='6' fill='var(--ac)'/><rect x='5' y='30' width='90' height='50' rx='6' fill='var(--ac2)'/><rect x='415' y='30' width='90' height='50' rx='6' fill='var(--ac2)'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='50' y='60'>R3 (AS 2)</text><text x='260' y='60' fill='#fff' font-weight='700'>R1 (borda)</text><text x='460' y='60'>R2 (AS 1)</text><text x='155' y='45' font-size='10'>eBGP</text><text x='360' y='45' font-size='10'>iBGP</text><text x='280' y='105' font-size='11'>O R2 recebe a rota com next hop 10.0.13.2, que ele não alcança</text></g></svg><p>Por padrão, ao passar uma rota de eBGP para iBGP, o <b>next hop não muda</b>. O R2 recebe a rota apontando para o IP do vizinho externo, que não está no IGP, e por isso a rota fica <b>inativa</b> (sem o símbolo “>” na tabela). Soluções:</p><ul><li><b>next-hop-self</b> no borda: ele se anuncia como next hop (a mais comum).</li><li>Anunciar a rede do enlace externo no IGP, como interface passiva.</li></ul></div>
<div class="card"><h3>5. Quanto da internet cada roteador recebe</h3><table><tr><th>Modelo</th><th>O que recebe</th><th>Quando usar</th></tr><tr><td>Somente default</td><td>Só a rota padrão do upstream</td><td>Cliente simples, um único provedor</td></tr><tr><td>Parcial</td><td>Rotas do upstream e uma padrão</td><td>Bom equilíbrio de política e memória</td></tr><tr><td>Full table</td><td>Todas as rotas da internet (cerca de 1 milhão)</td><td>Backbone e multihoming completo. Exige hardware com memória suficiente</td></tr></table></div>
<div class="card"><h3>6. Escolha do melhor caminho (completa)</h3><p>Quando há vários caminhos para o mesmo prefixo, o BGP avalia nesta ordem (Cisco), parando no primeiro desempate:</p><ol><li><b>Weight</b> (maior; local do roteador, só Cisco; na Huawei, <b>preferred-value</b>)</li><li><b>LOCAL_PREF</b> (maior)</li><li>Rota originada localmente</li><li><b>AS_PATH</b> mais curto</li><li><b>ORIGIN</b> (IGP vence EGP, que vence incomplete)</li><li><b>MED</b> (menor; só entre rotas do mesmo AS vizinho)</li><li><b>eBGP</b> em vez de iBGP</li><li>Menor custo do IGP até o next hop</li><li>Rota mais antiga (eBGP), depois menor router-id</li></ol><div class="tip">Lembrete: antes de tudo isso, o next hop precisa estar alcançável. Caminho sem next hop válido nem entra na disputa.</div></div>
<div class="card"><h3>7. Controlando saída e entrada de tráfego</h3><table><tr><th>Objetivo</th><th>Ferramenta</th><th>Alcance e limites</th></tr><tr><td>Escolher por onde SAIR</td><td>LOCAL_PREF (ou weight)</td><td>Você controla totalmente; vale em todo o seu AS pelo iBGP</td></tr><tr><td>Influenciar por onde ENTRAR</td><td>AS_PATH prepend</td><td>Fraco: o upstream pode ignorar; é só uma sugestão</td></tr><tr><td>Idem, entre dois mesmos ASs</td><td>MED</td><td>Só comparado entre rotas do mesmo AS vizinho</td></tr><tr><td>Controle fino de entrada</td><td>Communities do upstream</td><td>O upstream define o que cada community faz; é o mais eficaz</td></tr></table><p>O <b>prepend</b> repete o seu ASN no AS_PATH: <code>65001 65001 65001</code> parece um caminho mais longo e, portanto, menos atraente.</p></div>
<div class="card"><h3>8. Communities</h3><p>Uma <b>community</b> é uma etiqueta numérica anexada à rota (formato ASN:valor, como 65001:100). Existem as <b>padrão</b> e as <b>large communities</b>. Nas Cisco, é preciso habilitar o envio (<code>send-community</code>); na Huawei, <code>advertise-community</code>.</p><ul><li><b>no-export:</b> a rota não sai do AS do vizinho.</li><li><b>no-advertise:</b> a rota não é repassada a ninguém.</li><li><b>Usos comuns:</b> marcar a origem (cliente, peer, trânsito), pedir ao upstream prepend ou LOCAL_PREF menor, e acionar <b>blackhole remoto (RTBH)</b> para derrubar tráfego de um alvo atacado por DDoS.</li></ul></div>
<div class="card"><h3>9. Estabilidade e convergência</h3><ul><li><b>Timers:</b> keepalive 60 s e hold 180 s fazem uma queda silenciosa demorar para ser percebida.</li><li><b>BFD:</b> detecta falha de link em milissegundos e derruba a sessão BGP logo.</li><li><b>Soft reconfiguration / route refresh:</b> reaplica políticas sem derrubar a sessão.</li><li><b>Limite de prefixos</b> por vizinho protege contra vazamento.</li><li>Instabilidade (flap) frequente é sintoma de link ruim ou de equipamento sobrecarregado.</li></ul></div>
<div class="card"><h3>10. BGP e IPv6 (MP-BGP)</h3><p>O <b>MP-BGP</b> estende o BGP para transportar várias <b>famílias de endereços</b>: IPv4, IPv6, VPNs. Uma mesma sessão pode carregar IPv4 e IPv6, ativando cada família (<code>address-family ipv6</code>) e habilitando o vizinho nela. Os conceitos (AS_PATH, atributos, filtros) são iguais.</p></div>
<div class="card"><h3>11. Troubleshooting de BGP no NOC</h3><table><tr><th>Sintoma</th><th>Causa provável</th></tr><tr><td>Rotas externas sem o símbolo > no iBGP</td><td>Next hop inalcançável: faltou next-hop-self ou rota no IGP</td></tr><tr><td>Rota não chega a um roteador do AS</td><td>Regra do iBGP (sem RR) ou sessão ausente</td></tr><tr><td>Todo o tráfego sai por um único upstream</td><td>LOCAL_PREF maior em um deles ou AD diferente</td></tr><tr><td>Prefixo não aparece no vizinho</td><td>network sem rota exata, filtro de saída ou prefixo mais específico que /24</td></tr><tr><td>Sessão cai e volta</td><td>Link ruim, hold timer, BFD, CPU alta</td></tr><tr><td>Sessão derrubada por excesso</td><td>Limite de prefixos do vizinho excedido</td></tr><tr><td>Tráfego de ida e volta por caminhos diferentes</td><td>Normal na internet (assimetria); cuide só de firewalls stateful</td></tr></table></div>
<div class="card"><h3>Resumo</h3><ul><li>iBGP leva as rotas externas para dentro do AS e não repassa entre iBGP: full mesh ou route reflector.</li><li>Next hop não muda de eBGP para iBGP: use next-hop-self.</li><li>Saída: LOCAL_PREF. Entrada: prepend, MED e communities.</li><li>Use BFD e limites de prefixo para estabilidade.</li></ul></div>`,
 l:{about:'AS 65001 com R1 e R2 (iBGP), R3 no AS 65002 ligado ao R1 e R4 no AS 65003 ligado ao R2. R3 e R4 anunciam o mesmo prefixo, simulando a internet. Os níveis sobem de iBGP e next-hop-self, passando por LOCAL_PREF, prepend e community, até route reflector e falhas provocadas.',topo:[],svg:`<svg viewBox='0 0 560 140' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><rect x='140' y='10' width='280' height='95' rx='10' fill='none' stroke-dasharray='6 5'/><line x1='65' y1='65' x2='160' y2='65'/><line x1='230' y1='65' x2='330' y2='65' stroke-width='3'/><line x1='400' y1='65' x2='495' y2='65'/><circle cx='40' cy='65' r='26' fill='var(--ac2)'/><circle cx='195' cy='65' r='34' fill='var(--ac2)'/><circle cx='365' cy='65' r='34' fill='var(--ac2)'/><circle cx='520' cy='65' r='26' fill='var(--ac2)'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='40' y='70' font-weight='700'>R3</text><text x='195' y='70' font-weight='700'>R1</text><text x='365' y='70' font-weight='700'>R2</text><text x='520' y='70' font-weight='700'>R4</text><text x='280' y='28'>AS 65001</text><text x='40' y='108' font-size='10'>AS 65002</text><text x='520' y='108' font-size='10'>AS 65003</text><text x='280' y='56' font-size='10'>iBGP</text><text x='110' y='55' font-size='10'>eBGP</text><text x='450' y='55' font-size='10'>eBGP</text><text x='280' y='130' font-size='11'>R3 e R4 anunciam 198.51.100.0/24 · R1 anuncia 172.16.0.0/16</text></g></svg>`,
 pre:`<ul><li><b>Equipamentos:</b> 4 roteadores (Cisco CSR1000v ou IOSv; Huawei AR ou NE virtual). Tempo estimado: cerca de 90 minutos.</li></ul><div class="tip" style="border-left-color:var(--er)"><b>Atenção:</b> o BGP pode levar até cerca de 1 minuto para subir; espere e repita a verificação. Na Huawei, a sintaxe do BGP e das políticas muda entre versões do VRP: os avisos nos passos indicam onde. Este laboratório depende do OSPF do nível 1 para o iBGP funcionar pelas loopbacks.</div><table><tr><th>Ligação</th><th>Porta A</th><th>Porta B</th></tr><tr><td>R1 ↔ R2 (iBGP)</td><td>R1 g0/0</td><td>R2 g0/0</td></tr><tr><td>R1 ↔ R3 (eBGP)</td><td>R1 g0/1</td><td>R3 g0/0</td></tr><tr><td>R2 ↔ R4 (eBGP)</td><td>R2 g0/1</td><td>R4 g0/0</td></tr></table><table><tr><th>Equipamento</th><th>Loopback0</th><th>Enlaces</th></tr><tr><td>R1 (AS 65001)</td><td>1.1.1.1/32</td><td>g0/0 10.0.12.1/30 · g0/1 10.0.13.1/30</td></tr><tr><td>R2 (AS 65001)</td><td>2.2.2.2/32</td><td>g0/0 10.0.12.2/30 · g0/1 10.0.24.1/30</td></tr><tr><td>R3 (AS 65002)</td><td>3.3.3.3/32</td><td>g0/0 10.0.13.2/30</td></tr><tr><td>R4 (AS 65003)</td><td>4.4.4.4/32</td><td>g0/0 10.0.24.2/30</td></tr></table><p>Nos roteadores Huawei, g0/0 é GigabitEthernet0/0/0 e assim por diante. <b>Como zerar:</b> Cisco <code>write erase</code> e <code>reload</code>; Huawei <code>reset saved-configuration</code> e <code>reboot</code>. Cada passo indica o equipamento no título; o <b>gabarito</b> traz a configuração final de R1, R2, R3 e R4.</p>`,

{t:'Nível 1 · R3 e R4: nome e endereços',c:[['R3: hostname R3','R3: sysname R3','Nome do R3'],['R3: interface loopback0 / ip address 3.3.3.3 255.255.255.255','R3: interface LoopBack0 / ip address 3.3.3.3 32','Loopback do R3'],['R3: interface g0/0 / ip address 10.0.13.2 255.255.255.252 / no shutdown','R3: interface GigabitEthernet0/0/0 / ip address 10.0.13.2 30','Enlace com o R1 (lado do R3)'],['R4: hostname R4','R4: sysname R4','Nome do R4'],['R4: interface loopback0 / ip address 4.4.4.4 255.255.255.255','R4: interface LoopBack0 / ip address 4.4.4.4 32','Loopback do R4'],['R4: interface g0/0 / ip address 10.0.24.2 255.255.255.252 / no shutdown','R4: interface GigabitEthernet0/0/0 / ip address 10.0.24.2 30','Enlace com o R2 (lado do R4)']],x:'O ping do R1 ao 10.0.13.2 e do R2 ao 10.0.24.2 responde. Se falhar, confira os cabos e o estado das interfaces.'},
{t:'Nível 1 · R1: OSPF só para o interior do AS',w:'Anuncie no OSPF apenas a loopback e o enlace interno (R1–R2). O enlace externo (10.0.13.0/30) fica FORA do OSPF de propósito: é isso que cria o problema de next hop que você vai ver no nível 2. Na Huawei, os comandos area e network ficam dentro do ospf 1.',c:[['router ospf 1','ospf 1 router-id 1.1.1.1','Cria o OSPF (na Huawei, já fixa o router-id)'],['router-id 1.1.1.1','(já feito na linha anterior)','Fixa o router-id na Cisco'],['(a área vai em cada network)','area 0','Huawei: entra na área 0'],['network 1.1.1.1 0.0.0.0 area 0','network 1.1.1.1 0.0.0.0','Anuncia a loopback'],['network 10.0.12.0 0.0.0.3 area 0','network 10.0.12.0 0.0.0.3','Anuncia o enlace interno']]},
{t:'Nível 1 · R2: OSPF só para o interior do AS',c:[['router ospf 1','ospf 1 router-id 2.2.2.2','Cria o OSPF do R2'],['router-id 2.2.2.2','(já feito na linha anterior)','Fixa o router-id'],['(a área vai em cada network)','area 0','Huawei: entra na área 0'],['network 2.2.2.2 0.0.0.0 area 0','network 2.2.2.2 0.0.0.0','Anuncia a loopback'],['network 10.0.12.0 0.0.0.3 area 0','network 10.0.12.0 0.0.0.3','Anuncia o enlace interno']],x:'show ip ospf neighbor (display ospf peer brief) mostra o vizinho em FULL, e ping 2.2.2.2 com origem na loopback do R1 responde.'},
{t:'Nível 1 · R1: iBGP com o R2',w:'O iBGP usa o mesmo ASN dos dois lados. O update-source na loopback é obrigatório aqui, porque a sessão é pelas loopbacks. Na Huawei, em algumas versões é preciso habilitar o vizinho na família IPv4 (peer 2.2.2.2 enable).',c:[['router bgp 65001','bgp 65001','Cria o BGP no AS 65001'],['bgp router-id 1.1.1.1','router-id 1.1.1.1','Fixa o router-id'],['neighbor 2.2.2.2 remote-as 65001','peer 2.2.2.2 as-number 65001','Vizinho iBGP (mesmo ASN)'],['neighbor 2.2.2.2 update-source loopback0','peer 2.2.2.2 connect-interface LoopBack0','Sessão pela loopback']]},
{t:'Nível 1 · R2: iBGP com o R1',c:[['router bgp 65001','bgp 65001','Cria o BGP no AS 65001'],['bgp router-id 2.2.2.2','router-id 2.2.2.2','Fixa o router-id'],['neighbor 1.1.1.1 remote-as 65001','peer 1.1.1.1 as-number 65001','Vizinho iBGP'],['neighbor 1.1.1.1 update-source loopback0','peer 1.1.1.1 connect-interface LoopBack0','Sessão pela loopback'],['show ip bgp summary','display bgp peer','Verifica a sessão']],x:'A sessão iBGP fica Established entre 1.1.1.1 e 2.2.2.2 (pode levar até 1 minuto).'},
{t:'Nível 2 · R1: eBGP com o upstream A e o bloco do AS',w:'O network só anuncia o que existe exatamente na tabela de rotas: o bloco 172.16.0.0/16 precisa da rota para Null0. A sessão eBGP usa o IP do enlace direto, não a loopback.',c:[['router bgp 65001','bgp 65001','Entra no BGP'],['neighbor 10.0.13.2 remote-as 65002','peer 10.0.13.2 as-number 65002','Vizinho eBGP: o R3 (AS 65002)'],['ip route 172.16.0.0 255.255.0.0 null0','(fora do BGP) ip route-static 172.16.0.0 16 NULL0','Rota de suporte para o bloco do AS'],['network 172.16.0.0 mask 255.255.0.0','network 172.16.0.0 16','Anuncia o bloco do AS']]},
{t:'Nível 2 · R2: eBGP com o upstream B',c:[['router bgp 65001','bgp 65001','Entra no BGP'],['neighbor 10.0.24.2 remote-as 65003','peer 10.0.24.2 as-number 65003','Vizinho eBGP: o R4 (AS 65003)']]},
{t:'Nível 2 · R3 e R4: BGP e prefixo da internet simulada',w:'R3 e R4 anunciam o MESMO prefixo (198.51.100.0/24), cada um a partir do seu AS. Isso cria dois caminhos para o mesmo destino. A rota para Null0 sustenta o anúncio.',c:[['R3: ip route 198.51.100.0 255.255.255.0 null0','R3: ip route-static 198.51.100.0 24 NULL0','Rota de suporte no R3'],['R3: router bgp 65002 / bgp router-id 3.3.3.3','R3: bgp 65002 / router-id 3.3.3.3','BGP do R3 (AS 65002)'],['R3: neighbor 10.0.13.1 remote-as 65001','R3: peer 10.0.13.1 as-number 65001','Vizinho: o R1'],['R3: network 198.51.100.0 mask 255.255.255.0','R3: network 198.51.100.0 24','Anuncia o prefixo'],['R4: ip route 198.51.100.0 255.255.255.0 null0','R4: ip route-static 198.51.100.0 24 NULL0','Rota de suporte no R4'],['R4: router bgp 65003 / bgp router-id 4.4.4.4','R4: bgp 65003 / router-id 4.4.4.4','BGP do R4 (AS 65003)'],['R4: neighbor 10.0.24.1 remote-as 65001','R4: peer 10.0.24.1 as-number 65001','Vizinho: o R2'],['R4: network 198.51.100.0 mask 255.255.255.0','R4: network 198.51.100.0 24','Anuncia o mesmo prefixo']],x:'As sessões R1–R3 e R2–R4 ficam Established. show ip bgp (display bgp routing-table) mostra 198.51.100.0/24 nos dois roteadores do AS 65001.'},
{t:'Nível 2 · Observar o problema do next hop (R2)',w:'Faça esta observação ANTES de aplicar o next-hop-self no passo seguinte. É o ponto central do nível.',c:[['show ip bgp 198.51.100.0','display bgp routing-table 198.51.100.0','No R2: veja os dois caminhos para o prefixo']],x:'O R2 tem dois caminhos: um pelo R4 (next hop 10.0.24.2, válido, marcado com >) e um pelo R1 via iBGP com next hop 10.0.13.2. Esse segundo caminho não tem o símbolo > e não é usado, pois o R2 não alcança 10.0.13.2 (o enlace externo não está no OSPF).'},
{t:'Nível 2 · R1 e R2: next-hop-self',c:[['R1: router bgp 65001 / neighbor 2.2.2.2 next-hop-self','R1: bgp 65001 / peer 2.2.2.2 next-hop-local','R1 passa a anunciar a si mesmo (1.1.1.1) como next hop ao R2'],['R2: router bgp 65001 / neighbor 1.1.1.1 next-hop-self','R2: bgp 65001 / peer 1.1.1.1 next-hop-local','R2 faz o mesmo para o R1 (simetria)'],['clear ip bgp * soft','refresh bgp all import','Reaplica sem derrubar a sessão'],['show ip bgp 198.51.100.0 (no R2)','display bgp routing-table 198.51.100.0 (no R2)','Confere o resultado']],x:'No R2, o caminho pelo R1 agora tem next hop 1.1.1.1 (alcançável pelo OSPF) e fica válido. O melhor caminho continua sendo o do R4 (eBGP antes de iBGP, com AS_PATH do mesmo tamanho).'},
{t:'Nível 3 · R1: LOCAL_PREF para preferir o upstream A',w:'O LOCAL_PREF é aplicado na ENTRADA (import) do R1 e viaja pelo iBGP até o R2. Ele não é enviado a vizinhos eBGP. Depois de aplicar, reaplique a política com soft reset. Na Huawei, a sintaxe de route-policy pode variar entre versões.',c:[['route-map PREFERIR permit 10','route-policy PREFERIR permit node 10','Cria a política'],['set local-preference 200','apply local-preference 200','LOCAL_PREF 200 (o padrão é 100)'],['router bgp 65001','bgp 65001','Entra no BGP'],['neighbor 10.0.13.2 route-map PREFERIR in','peer 10.0.13.2 route-policy PREFERIR import','Aplica na entrada, do R3'],['clear ip bgp * soft in','refresh bgp all import','Reaplica sem derrubar a sessão'],['show ip bgp 198.51.100.0 (no R2)','display bgp routing-table 198.51.100.0 (no R2)','Veja o melhor caminho no R2']],x:'No R2, o melhor caminho passa a ser o recebido do R1 (next hop 1.1.1.1), com LOCAL_PREF 200, vencendo o caminho direto pelo R4 que tem 100. O tráfego do R2 para 198.51.100.0/24 passa pelo R1 e sai pelo R3.'},
{t:'Nível 4 · R2: AS_PATH prepend na saída para o R4',w:'O prepend repete o seu próprio ASN (65001) e só vale na saída para outros ASs. É uma sugestão fraca: o vizinho pode ignorá-la. Na Huawei, o apply as-path usa a palavra additive para somar ao caminho existente.',c:[['route-map PREPEND permit 10','route-policy PREPEND permit node 10','Cria a política de saída'],['set as-path prepend 65001 65001','apply as-path 65001 65001 additive','Repete o ASN 2 vezes a mais'],['router bgp 65001','bgp 65001','Entra no BGP'],['neighbor 10.0.24.2 route-map PREPEND out','peer 10.0.24.2 route-policy PREPEND export','Aplica na saída para o R4'],['clear ip bgp * soft out','refresh bgp all export','Reaplica sem derrubar a sessão'],['R4: show ip bgp 172.16.0.0','R4: display bgp routing-table 172.16.0.0','No R4: veja o AS_PATH']],x:'No R4, o prefixo 172.16.0.0/16 chega com AS_PATH 65001 65001 65001 (o original mais dois prepends): um caminho propositalmente menos atraente.'},
{t:'Nível 4 · R1: community no-export para o R3',w:'Communities só viajam se o envio for habilitado (send-community na Cisco, advertise-community na Huawei). A community no-export impede que o R3 repasse a rota a outros ASs.',c:[['route-map COM permit 10','route-policy COM permit node 10','Cria a política'],['set community no-export','apply community no-export','Marca a rota com no-export'],['router bgp 65001','bgp 65001','Entra no BGP'],['neighbor 10.0.13.2 send-community','peer 10.0.13.2 advertise-community','Habilita o envio de communities'],['neighbor 10.0.13.2 route-map COM out','peer 10.0.13.2 route-policy COM export','Aplica na saída para o R3'],['clear ip bgp * soft out','refresh bgp all export','Reaplica sem derrubar a sessão'],['R3: show ip bgp 172.16.0.0','R3: display bgp routing-table 172.16.0.0','No R3: veja a community']],x:'No R3, o prefixo 172.16.0.0/16 aparece com a community no-export.'},
{t:'Nível 5 · R1: route reflector',w:'Com só dois roteadores no AS, o route reflector aqui serve para praticar o comando. O ganho real aparece com três ou mais roteadores iBGP.',c:[['router bgp 65001','bgp 65001','Entra no BGP'],['neighbor 2.2.2.2 route-reflector-client','peer 2.2.2.2 reflect-client','R1 vira route reflector e o R2 vira cliente'],['show ip bgp neighbors 2.2.2.2','display bgp peer 2.2.2.2 verbose','Confere se o R2 aparece como cliente do RR']],x:'A saída do neighbor mostra Route-Reflector Client (Cisco) ou o papel de reflect-client (Huawei).'},
{t:'Nível 5 · Falhas provocadas',w:'Faça uma falha de cada vez e corrija antes da próxima. Se você ainda estiver com LOCAL_PREF e prepend ativos, os resultados de caminho preferido refletem essas políticas.',c:[['R1: router bgp 65001 / no neighbor 2.2.2.2 next-hop-self','R1: bgp 65001 / undo peer 2.2.2.2 next-hop-local','Falha 1: sem next-hop-self. As rotas externas ficam inativas no R2'],['R1: neighbor 2.2.2.2 next-hop-self','R1: peer 2.2.2.2 next-hop-local','Corrige a Falha 1'],['R1: no neighbor 2.2.2.2 update-source loopback0','R1: undo peer 2.2.2.2 connect-interface','Falha 2: sem update-source. A sessão iBGP cai; veja o estado'],['R1: neighbor 2.2.2.2 update-source loopback0','R1: peer 2.2.2.2 connect-interface LoopBack0','Corrige a Falha 2'],['R1: neighbor 2.2.2.2 remote-as 65099','R1: peer 2.2.2.2 as-number 65099','Falha 3: ASN errado. A sessão deixa de ser iBGP e quebra'],['R1: neighbor 2.2.2.2 remote-as 65001','R1: peer 2.2.2.2 as-number 65001','Corrige a Falha 3']],x:'Falha 1: o caminho do R1 no R2 perde o símbolo >. Falha 2: a sessão fica em Active/Idle. Falha 3: a sessão cai e o log reclama do ASN. Depois de cada correção, a sessão volta a Established.'}],
 gab:{cisco:`<h4>R1</h4><pre class='gb'>hostname R1
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.13.1 255.255.255.252
 no shutdown
router ospf 1
 router-id 1.1.1.1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
ip route 172.16.0.0 255.255.0.0 Null0
route-map PREFERIR permit 10
 set local-preference 200
route-map COM permit 10
 set community no-export
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 2.2.2.2 remote-as 65001
 neighbor 2.2.2.2 update-source Loopback0
 neighbor 2.2.2.2 next-hop-self
 neighbor 2.2.2.2 route-reflector-client
 neighbor 10.0.13.2 remote-as 65002
 neighbor 10.0.13.2 send-community
 neighbor 10.0.13.2 route-map PREFERIR in

 network 172.16.0.0 mask 255.255.0.0</pre><h4>R2</h4><pre class='gb'>hostname R2

interface GigabitEthernet0/0

 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.24.1 255.255.255.252
 no shutdown
router ospf 1
 router-id 2.2.2.2
 network 2.2.2.2 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
route-map PREPEND permit 10
 set as-path prepend 65001 65001
router bgp 65001
 bgp router-id 2.2.2.2
 neighbor 1.1.1.1 remote-as 65001
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 1.1.1.1 next-hop-self
 neighbor 10.0.24.2 remote-as 65003
 neighbor 10.0.24.2 route-map PREPEND out</pre><h4>R3</h4><pre class='gb'>hostname R3
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.13.2 255.255.255.252
 no shutdown
ip route 198.51.100.0 255.255.255.0 Null0
router bgp 65002
 bgp router-id 3.3.3.3
 neighbor 10.0.13.1 remote-as 65001
 network 198.51.100.0 mask 255.255.255.0</pre><h4>R4</h4><pre class='gb'>hostname R4
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.24.2 255.255.255.252
 no shutdown
ip route 198.51.100.0 255.255.255.0 Null0
router bgp 65003
 bgp router-id 4.4.4.4
 neighbor 10.0.24.1 remote-as 65001
 network 198.51.100.0 mask 255.255.255.0</pre>`,huawei:`<h4>R1</h4><pre class='gb'>sysname R1
interface LoopBack0
 ip address 1.1.1.1 32
interface GigabitEthernet0/0/0
 ip address 10.0.12.1 30
interface GigabitEthernet0/0/1
 ip address 10.0.13.1 30
ospf 1 router-id 1.1.1.1
 area 0.0.0.0
  network 1.1.1.1 0.0.0.0
  network 10.0.12.0 0.0.0.3
ip route-static 172.16.0.0 16 NULL0
route-policy PREFERIR permit node 10
 apply local-preference 200
route-policy COM permit node 10
 apply community no-export
bgp 65001

 peer 2.2.2.2 as-number 65001
 peer 2.2.2.2 connect-interface LoopBack0

bgp 65001
 router-id 2.2.2.2

 peer 1.1.1.1 next-hop-local

 peer 10.0.13.1 as-number 65001

 lOld:{about:'AS 65001 com R1 e R2 (iBGP), R3 no AS 65002 (upstream A) ligado ao R1, e R4 no AS 65003 (upstream B) ligado ao R2. Enlaces: R1–R2 10.0.12.0/30, R1–R3 10.0.13.0/30 (R3 .2), R2–R4 10.0.24.0/30 (R4 .2). Loopbacks 1.1.1.1 (R1) e 2.2.2.2 (R2). R3 e R4 anunciam 198.51.100.0/24, simulando a internet.',topo:[],svg:`<svg viewBox='0 0 560 140' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><rect x='140' y='10' width='280' height='95' rx='10' fill='none' stroke-dasharray='6 5'/><line x1='65' y1='65' x2='160' y2='65'/><line x1='230' y1='65' x2='330' y2='65' stroke-width='3'/><line x1='400' y1='65' x2='495' y2='65'/><circle cx='40' cy='65' r='26' fill='var(--ac2)'/><circle cx='195' cy='65' r='34' fill='var(--ac2)'/><circle cx='365' cy='65' r='34' fill='var(--ac2)'/><circle cx='520' cy='65' r='26' fill='var(--ac2)'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='40' y='70' font-weight='700'>R3</text><text x='195' y='70' font-weight='700'>R1</text><text x='365' y='70' font-weight='700'>R2</text><text x='520' y='70' font-weight='700'>R4</text><text x='280' y='28'>AS 65001</text><text x='40' y='108' font-size='10'>AS 65002</text><text x='520' y='108' font-size='10'>AS 65003</text><text x='280' y='56' font-size='10'>iBGP</text><text x='110' y='55' font-size='10'>eBGP</text><text x='450' y='55' font-size='10'>eBGP</text></g></svg>`,

{t:'Nível 3 · Escolher a saída com LOCAL_PREF',c:[['route-map PREFERIR permit 10 / set local-preference 200','route-policy PREFERIR permit node 10 / apply local-preference 200','R1: política que valoriza o upstream A'],['neighbor 10.0.13.2 route-map PREFERIR in','peer 10.0.13.2 route-policy PREFERIR import','Aplica na entrada (o LOCAL_PREF viaja pelo iBGP até o R2)'],['clear ip bgp * soft in','refresh bgp all import','Reaplica sem derrubar a sessão'],['show ip bgp 198.51.100.0','display bgp routing-table 198.51.100.0','No R1 e no R2: o melhor caminho sai pelo R3 (LOCAL_PREF 200)']]},

 {q:'O que o route reflector resolve?',o:['A falta de IPs','A necessidade de full mesh','O prepend','A MTU'],a:1,e:'Os clientes precisam de sessão só com o RR.'},
 {q:'Ao passar de eBGP para iBGP, o que acontece com o next hop por padrão?',o:['É alterado para o roteador de borda','Não muda','É removido','Vira 0.0.0.0'],a:1,e:'Por isso se usa next-hop-self.'},
 {q:'O que faz o next-hop-self?',o:['Apaga o next hop','O roteador se anuncia como next hop ao repassar rotas','Muda o ASN','Criptografa o next hop'],a:1,e:'O interior do AS passa a alcançar o next hop pelo IGP.'},
 {q:'Qual a AD padrão do iBGP na Cisco?',o:['20','110','200','255'],a:2,e:'iBGP = 200.'},
 {q:'O LOCAL_PREF influencia principalmente:',o:['A entrada de tráfego no AS','A saída de tráfego do AS (maior vence)','A MTU','O custo OSPF'],a:1,e:'Você controla a saída; ele viaja pelo iBGP.'},
 {q:'O AS_PATH prepend serve para:',o:['Influenciar a entrada, tornando um caminho menos atrativo','Acelerar o BGP','Escolher a saída','Criar VLAN'],a:0,e:'É uma sugestão fraca aos outros ASs.'},
 {q:'Como o MED é interpretado?',o:['Maior vence, entre quaisquer rotas','Menor vence, entre rotas do mesmo AS vizinho','Sempre ignorado','Define o ASN'],a:1,e:'MED = Multi-Exit Discriminator, menor é melhor.'},
 {q:'O que faz a community no-export?',o:['Impede a rota de sair do AS do vizinho','Apaga a rota','Aumenta o LOCAL_PREF','Cria um túnel'],a:0,e:'A rota não é repassada a outros ASs.'},

 {q:'Por que o iBGP normalmente usa loopbacks?',o:['Para economizar IP','Para a sessão não depender de um único enlace, apoiada no IGP','Porque é obrigatório','Para usar UDP'],a:1,e:'A loopback fica up enquanto houver qualquer caminho.'},
