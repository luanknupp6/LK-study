 t:`<div class="card"><h3>1. O que é PPPoE e por que provedores usam</h3><p><b>PPPoE</b> é o PPP (Point-to-Point Protocol) rodando sobre Ethernet. Ele cria uma “ligação discada” entre o roteador do cliente e o concentrador do provedor, com <b>usuário e senha</b> por cliente.</p><ul><li><b>Autenticação:</b> só entra quem tem login válido.</li><li><b>Controle por cliente:</b> velocidade do plano, IP fixo ou dinâmico, bloqueio por inadimplência.</li><li><b>Accounting:</b> registro de quando cada cliente conectou e quanto usou.</li></ul><p>A alternativa é o IPoE (DHCP sem login), mais simples, mas com menos controle por cliente.</p></div>
<div class="card"><h3>2. O caminho do cliente até a internet</h3><svg viewBox='0 0 560 120' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><line x1='95' y1='60' x2='140' y2='60'/><line x1='210' y1='60' x2='250' y2='60'/><line x1='320' y1='60' x2='360' y2='60'/><line x1='440' y1='60' x2='480' y2='60'/><rect x='20' y='38' width='75' height='44' rx='6' fill='var(--ac2)'/><rect x='140' y='38' width='70' height='44' rx='6' fill='var(--ac2)'/><rect x='250' y='38' width='70' height='44' rx='6' fill='var(--ac2)'/><rect x='360' y='38' width='80' height='44' rx='6' fill='var(--ac)'/><rect x='480' y='38' width='70' height='44' rx='6' fill='var(--ac2)'/></g><g fill='currentColor' font-size='11' text-anchor='middle'><text x='57' y='58'>Roteador</text><text x='57' y='72'>cliente</text><text x='175' y='64'>ONU</text><text x='285' y='64'>OLT</text><text x='400' y='58' fill='#fff' font-weight='700'>BNG</text><text x='400' y='72' fill='#fff'>MikroTik</text><text x='515' y='64'>Internet</text><text x='280' y='105'>O PPPoE vai do roteador do cliente até o BNG (concentrador)</text></g></svg><p>A <b>ONU</b> termina a fibra no cliente (em modo bridge, ela apenas repassa os quadros). A <b>OLT</b> concentra as fibras. O <b>BNG</b> (ou BRAS) é o equipamento que recebe as sessões PPPoE; em muitos provedores é um MikroTik. Depois dele a rede segue com roteamento (OSPF e BGP).</p></div>
<div class="card"><h3>3. As fases do PPPoE</h3><table><tr><th>Fase</th><th>Mensagens</th><th>O que acontece</th></tr><tr><td>Discovery</td><td>PADI, PADO, PADR, PADS</td><td>O cliente manda um broadcast (PADI) procurando concentradores; o servidor oferece (PADO); o cliente escolhe (PADR) e a sessão recebe um ID (PADS)</td></tr><tr><td>LCP</td><td>Configure-Request/Ack</td><td>Negocia MTU, método de autenticação e keepalive</td></tr><tr><td>Autenticação</td><td>PAP, CHAP, MS-CHAPv2</td><td>Valida usuário e senha</td></tr><tr><td>IPCP</td><td>IP Configuration</td><td>Entrega IP, DNS e gateway ao cliente</td></tr><tr><td>Dados</td><td>Quadros PPP</td><td>O tráfego de internet passa</td></tr><tr><td>Termination</td><td>PADT</td><td>Encerra a sessão</td></tr></table><p>O Discovery usa EtherType <code>0x8863</code> e a sessão usa <code>0x8864</code>.</p></div>
<div class="card"><h3>4. MTU e MSS no PPPoE</h3><p>O PPPoE adiciona <b>8 bytes</b> de cabeçalho (6 do PPPoE e 2 do PPP). Por isso a MTU da conexão cai de 1500 para <b>1492</b>, e o MSS do TCP para <b>1452</b>. Se isso não for ajustado, ocorre o sintoma clássico: o cliente conecta, páginas pequenas abrem, mas sites e downloads grandes travam. A solução é ajustar o MSS (clamp) no roteador.</p></div>
<div class="card"><h3>5. Autenticação: PAP, CHAP e RADIUS</h3><table><tr><th>Método</th><th>Como funciona</th><th>Segurança</th></tr><tr><td>PAP</td><td>Envia a senha em texto puro</td><td>Baixa</td></tr><tr><td>CHAP</td><td>O servidor envia um desafio e o cliente responde com hash</td><td>Boa</td></tr><tr><td>MS-CHAPv2</td><td>CHAP da Microsoft, com autenticação mútua</td><td>Boa</td></tr></table><p>Em provedores pequenos, os usuários ficam no próprio MikroTik (<b>secrets</b>). Nos maiores, o BNG consulta um <b>RADIUS</b>, servidor central de <b>AAA</b> (Authentication, Authorization e Accounting), integrado ao sistema de cobrança. O RADIUS pode devolver atributos como a velocidade do plano. Portas padrão: 1812/UDP (autenticação) e 1813/UDP (accounting).</p></div>
<div class="card"><h3>6. MikroTik: o essencial</h3><p>O MikroTik roda o <b>RouterOS</b>. Você o administra pelo <b>Winbox</b> (programa gráfico), pelo terminal (SSH) ou pela web. A certificação básica é a <b>MTCNA</b>, que está no seu plano.</p><table><tr><th>Menu do terminal</th><th>Para quê</th></tr><tr><td>/interface</td><td>Portas, bridge, VLAN, PPPoE</td></tr><tr><td>/ip address</td><td>Endereços IP</td></tr><tr><td>/ip route</td><td>Rotas</td></tr><tr><td>/ip firewall nat e filter</td><td>NAT e regras de firewall</td></tr><tr><td>/ip dhcp-server e dhcp-client</td><td>DHCP</td></tr><tr><td>/ppp</td><td>Profiles, secrets e sessões ativas</td></tr><tr><td>/queue</td><td>Limitação de velocidade</td></tr><tr><td>/system</td><td>Identidade, logs, backup, usuários</td></tr></table><div class="tip">Dica de terminal: use <code>print</code> para listar, <code>add</code> para criar, <code>set</code> para alterar, <code>remove</code> para apagar e <code>export</code> para ver a configuração inteira. A tecla Tab completa os comandos.</div></div>
<div class="card"><h3>7. Servidor PPPoE no MikroTik: as peças</h3><ul><li><b>Pool:</b> faixa de IPs que serão entregues aos clientes.</li><li><b>Profile:</b> modelo de plano: IP do servidor (local-address), pool dos clientes (remote-address), velocidade (rate-limit) e DNS.</li><li><b>Secret:</b> usuário e senha de cada cliente, ligado a um profile.</li><li><b>PPPoE Server:</b> o serviço que escuta na interface voltada para os clientes.</li><li><b>Active:</b> lista das sessões conectadas agora.</li></ul></div>
<div class="card"><h3>8. NAT e firewall</h3><p>O <b>NAT masquerade</b> troca o IP privado do cliente pelo IP da interface de saída. No firewall, as regras são lidas de <b>cima para baixo</b> e vale a <b>primeira que casa</b>. As correntes principais são: <b>input</b> (tráfego para o próprio roteador), <b>forward</b> (tráfego atravessando) e <b>output</b> (saído do roteador). Boa prática de input: aceitar conexões established/related, descartar invalid e bloquear o resto vindo da WAN, sempre <b>depois</b> de garantir o seu acesso, para não se trancar para fora.</p></div>
<div class="card"><h3>9. Troubleshooting de PPPoE no NOC</h3><table><tr><th>Sintoma</th><th>Causa provável</th></tr><tr><td>Cliente sem sessão, PADI sem resposta</td><td>ONU em modo router, VLAN errada, fibra com problema ou servidor PPPoE parado</td></tr><tr><td>Authentication failed</td><td>Usuário ou senha errados, secret desativado, método PAP/CHAP diferente</td></tr><tr><td>Conecta mas não recebe IP</td><td>Pool esgotado ou profile sem remote-address</td></tr><tr><td>Conecta e não navega</td><td>NAT ausente, DNS errado, MTU/MSS</td></tr><tr><td>Sites grandes travam</td><td>MTU de 1492 sem ajuste de MSS</td></tr><tr><td>Quedas frequentes</td><td>Sinal óptico ruim, keepalive falhando, login duplicado</td></tr><tr><td>Lentidão</td><td>Rate-limit do plano, fila saturada, link de upstream cheio</td></tr></table><p>No MikroTik, comece por <code>/ppp active print</code> e pelo log (<code>/log print</code>).</p></div>
<div class="card"><h3>Resumo</h3><ul><li>PPPoE = PPP sobre Ethernet: Discovery, LCP, autenticação, IPCP e dados.</li><li>MTU 1492 e MSS 1452: ajustar o MSS no roteador.</li><li>MikroTik: pool, profile, secret e PPPoE server.</li><li>Em escala, o controle fica no RADIUS.</li></ul></div>`,
 l:{v:['RouterOS (terminal)','Winbox (menu)'],about:'Dois MikroTiks (CHR) no PNETLAB: o BNG (concentrador do provedor) e o CLIENTE, com um PC atrás do cliente. Os níveis sobem do básico no BNG até servidor PPPoE, cliente PPPoE, planos e controle, firewall, MSS e falhas provocadas.',topo:[],svg:`<svg viewBox='0 0 560 130' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><line x1='95' y1='55' x2='175' y2='55'/><line x1='300' y1='55' x2='380' y2='55'/><line x1='465' y1='55' x2='500' y2='55'/><rect x='15' y='33' width='80' height='44' rx='6' fill='var(--ac2)'/><rect x='175' y='28' width='125' height='54' rx='6' fill='var(--ac)'/><rect x='380' y='33' width='85' height='44' rx='6' fill='var(--ac2)'/><rect x='500' y='38' width='55' height='34' rx='6' fill='none'/></g><g fill='currentColor' font-size='11' text-anchor='middle'><text x='55' y='52'>Nuvem NAT</text><text x='55' y='66'>(internet)</text><text x='237' y='52' fill='#fff' font-weight='700'>BNG</text><text x='237' y='68' fill='#fff'>MikroTik CHR</text><text x='422' y='52' font-weight='700'>CLIENTE</text><text x='422' y='66'>MikroTik CHR</text><text x='527' y='60'>PC</text><text x='135' y='45' font-size='10'>ether1</text><text x='340' y='45' font-size='10'>ether2↔ether1</text><text x='482' y='45' font-size='10'>ether2</text><text x='280' y='112' font-size='11'>PPPoE entre CLIENTE e BNG</text></g></svg>`,
 pre:`<ul><li><b>Equipamentos:</b> 2 MikroTik CHR (BNG e CLIENTE), 1 nuvem NAT (internet) e 1 PC (VPCS). Tempo estimado: cerca de 75 minutos.</li></ul><div class="tip" style="border-left-color:var(--er)"><b>Atenção antes de começar:</b> (1) o Winbox não roda dentro do PNETLAB: configure pelo console e, se quiser usar o Winbox, acesse pelo IP do CHR a partir do seu computador. (2) O CHR sem licença limita a velocidade a cerca de 1 Mbps: serve para o lab, mas os planos de 10M e 50M não serão medidos de verdade; você vai confirmar o limite na fila (queue), não em teste de velocidade. (3) Os comandos servem para o RouterOS 6 e 7, com pequenas diferenças de saída. (4) O CHR costuma vir com um cliente DHCP na ether1; o passo do CLIENTE trata disso. (5) Login padrão: usuário admin e senha em branco.</div><table><tr><th>Ligação</th><th>Porta A</th><th>Porta B</th></tr><tr><td>BNG ↔ internet</td><td>BNG ether1</td><td>Nuvem NAT</td></tr><tr><td>BNG ↔ CLIENTE</td><td>BNG ether2</td><td>CLIENTE ether1</td></tr><tr><td>CLIENTE ↔ PC</td><td>CLIENTE ether2</td><td>PC</td></tr></table><table><tr><th>Item</th><th>Valor</th></tr><tr><td>BNG ether1</td><td>IP por DHCP da nuvem NAT</td></tr><tr><td>BNG ether2</td><td>Sem IP (PPPoE server)</td></tr><tr><td>Pool PPPoE</td><td>172.16.0.10 a 172.16.0.250 · gateway do BNG 172.16.0.1</td></tr><tr><td>Usuário PPPoE</td><td>cliente1 · senha senha123</td></tr><tr><td>CLIENTE ether2 (LAN)</td><td>192.168.10.1/24</td></tr><tr><td>PC</td><td>192.168.10.10/24 · gw 192.168.10.1</td></tr></table><p><b>Como zerar:</b> <code>/system reset-configuration no-defaults=yes skip-backup=yes</code>. Cada passo indica o equipamento no título; o <b>gabarito</b> traz a configuração final do BNG e do CLIENTE.</p>`,
 s:[{t:'Nível 1 · PC: IP e gateway (VPCS)',c:[['PC> ip 192.168.10.10/24 192.168.10.1','PC> ip 192.168.10.10/24 192.168.10.1','IP, máscara e gateway do PC do cliente']]},
{t:'Nível 1 · BNG: básico e saída para a internet',w:'Se a sua nuvem NAT não der acesso à internet, o ping para 8.8.8.8 vai falhar. Nesse caso, confirme ao menos que a ether1 recebeu IP e consegue alcançar o gateway dela. Se o comando do DHCP client reclamar que já existe um na ether1 (padrão do CHR), ignore.',c:[['/system identity set name=BNG','System > Identity','Nome do roteador (BNG = concentrador)'],['/ip dhcp-client add interface=ether1 disabled=no','IP > DHCP Client > +','A ether1 pega IP da nuvem NAT'],['/ip dns set servers=8.8.8.8 allow-remote-requests=yes','IP > DNS','Define o servidor DNS'],['/ip firewall nat add chain=srcnat out-interface=ether1 action=masquerade','IP > Firewall > NAT > +','NAT masquerade na saída para a internet']]},
{t:'Nível 1 · BNG: verificar',c:[['/ip address print','IP > Addresses','Mostra o IP recebido por DHCP na ether1'],['/ping 8.8.8.8 count=4','Tools > Ping','Testa a saída para a internet']],x:'A ether1 aparece com um IP dinâmico (flag D). O ping para 8.8.8.8 responde 4 de 4, se a nuvem NAT tiver internet.'},
{t:'Nível 2 · BNG: servidor PPPoE',w:'Não coloque IP na ether2: o PPPoE roda direto na interface. Os métodos de autenticação do servidor (chap e mschap2) precisam ser aceitos pelo cliente. O rate-limit do profile tem o formato upload/download, visto pelo roteador: o primeiro valor é o upload do cliente, o segundo o download.',c:[['/ip pool add name=pool-pppoe ranges=172.16.0.10-172.16.0.250','IP > Pool > +','Faixa de IPs que os clientes receberão'],['/ppp profile add name=plano-10M local-address=172.16.0.1 remote-address=pool-pppoe rate-limit=10M/10M dns-server=8.8.8.8','PPP > Profiles > +','Perfil do plano: IP do BNG, pool dos clientes, velocidade e DNS'],['/ppp secret add name=cliente1 password=senha123 service=pppoe profile=plano-10M','PPP > Secrets > +','Cria o usuário do cliente'],['/interface pppoe-server server add service-name=provedor interface=ether2 default-profile=plano-10M authentication=chap,mschap2 disabled=no','PPP > PPPoE Servers > +','Liga o servidor PPPoE na porta do cliente']]},
{t:'Nível 2 · BNG: verificar',c:[['/interface pppoe-server server print','PPP > PPPoE Servers','Confere o servidor ativo'],['/ppp active print','PPP > Active Connections','Lista os clientes conectados']],x:'O servidor aparece habilitado na ether2. A lista de conexões ativas está vazia, porque o cliente ainda não foi configurado.'},
{t:'Nível 3 · CLIENTE: conexão PPPoE',w:'No CLIENTE, remova o cliente DHCP da ether1 se ele existir (padrão do CHR): ele competiria com o PPPoE. Se o comando de remoção não achar nada, tudo bem.',c:[['/system identity set name=CLIENTE','System > Identity','Nome do roteador'],['/ip dhcp-client remove [find]','IP > DHCP Client > Remove','Remove o DHCP client padrão, se houver'],['/interface pppoe-client add name=pppoe-out1 interface=ether1 user=cliente1 password=senha123 add-default-route=yes use-peer-dns=yes disabled=no','PPP > + > PPPoE Client','Disca PPPoE pela ether1 e instala a rota padrão']]},
{t:'Nível 3 · CLIENTE: LAN e NAT',c:[['/ip address add address=192.168.10.1/24 interface=ether2','IP > Addresses > +','Gateway do PC do cliente'],['/ip firewall nat add chain=srcnat out-interface=pppoe-out1 action=masquerade','IP > Firewall > NAT > +','NAT da LAN pela conexão PPPoE']]},
{t:'Nível 3 · Verificar de ponta a ponta',c:[['/interface pppoe-client print','PPP > Interface','No CLIENTE: status da conexão (flag R = running)'],['/ip address print','IP > Addresses','No CLIENTE: o IP 172.16.0.x dinâmico em pppoe-out1'],['/ppp active print','PPP > Active Connections','No BNG: cliente1 conectado, com o IP entregue'],['/ping 8.8.8.8 count=4','Tools > Ping','No CLIENTE: saída pela conexão'],['PC> ping 8.8.8.8','PC> ping 8.8.8.8','No PC: ponta a ponta']],x:'O pppoe-out1 aparece com a flag R, com IP 172.16.0.x dinâmico. No BNG, cliente1 aparece em Active com o mesmo IP. O ping do CLIENTE e do PC a 8.8.8.8 responde (o do PC passa por duas traduções NAT: no CLIENTE e no BNG).'},
{t:'Nível 4 · BNG: planos e controle de clientes',w:'Trocar o profile da secret não muda a sessão ativa: é preciso derrubá-la para o cliente reconectar com o plano novo. Como o CHR sem licença limita a velocidade, confirme o plano na fila (queue), não em teste de velocidade.',c:[['/ppp profile add name=plano-50M local-address=172.16.0.1 remote-address=pool-pppoe rate-limit=50M/50M dns-server=8.8.8.8','PPP > Profiles > +','Cria um segundo plano'],['/ppp secret set cliente1 profile=plano-50M','PPP > Secrets (duplo clique)','Muda o cliente de plano'],['/ppp active remove [find name=cliente1]','PPP > Active Connections > Remove','Derruba a sessão; o cliente reconecta sozinho'],['/queue simple print','Queues > Simple Queues','Mostra a fila dinâmica criada com o plano'],['/ppp secret set cliente1 remote-address=172.16.0.100','PPP > Secrets (duplo clique)','IP fixo para o cliente (vale na próxima conexão)'],['/ppp secret disable cliente1','Botão Disable na secret','Suspende o cliente (impede nova conexão)'],['/ppp secret enable cliente1','Botão Enable na secret','Reativa o cliente']],x:'Depois de derrubar a sessão, o cliente reconecta e a fila mostra o limite de 50M/50M. Com o IP fixo configurado, a próxima conexão recebe 172.16.0.100. Com a secret desativada, o cliente não volta até ser reativada.'},
{t:'Nível 5 · BNG: firewall básico',w:'Cuidado para não se trancar para fora: a ether1 é o lado da nuvem NAT, por onde você acessaria o Winbox ou o SSH. Por isso a terceira regra libera o acesso de gerenciamento (portas 22 e 8291) antes do drop final. As regras são lidas de cima para baixo: a ordem importa, e o drop precisa ser a última.',c:[['/ip firewall filter add chain=input connection-state=established,related action=accept','IP > Firewall > Filter > +','Aceita respostas de conexões já abertas'],['/ip firewall filter add chain=input connection-state=invalid action=drop','IP > Firewall > Filter > +','Descarta tráfego inválido'],['/ip firewall filter add chain=input in-interface=ether1 protocol=tcp dst-port=22,8291 action=accept','IP > Firewall > Filter > +','Libera SSH e Winbox pela ether1 (gerenciamento)'],['/ip firewall filter add chain=input in-interface=ether1 action=drop','IP > Firewall > Filter > +','Bloqueia o resto que chega pela ether1 (deixe por último)']],x:'O PPPoE e a saída para a internet continuam funcionando (o tráfego de passagem usa a chain forward). O acesso ao próprio BNG pela ether1 fica limitado às portas liberadas.'},
{t:'Nível 5 · CLIENTE: ajuste de MSS',c:[['/ip firewall mangle add chain=forward protocol=tcp tcp-flags=syn out-interface=pppoe-out1 action=change-mss new-mss=clamp-to-pmtu passthrough=yes','IP > Firewall > Mangle > +','Ajusta o MSS para a MTU de 1492 do PPPoE']],x:'/ip firewall mangle print mostra a regra. Em redes reais, ela evita o sintoma de sites grandes travarem com PPPoE.'},
{t:'Nível 5 · Logs e falhas provocadas',w:'Os logs de debug do PPPoE são muito verbosos. Ative só durante o diagnóstico e remova depois (veja o número da regra com /system logging print). Faça uma falha de cada vez e corrija antes da próxima.',c:[['BNG: /system logging add topics=pppoe,ppp,debug action=memory','BNG: System > Logging > +','Ativa o log de depuração'],['BNG: /ppp secret set cliente1 password=errada','BNG: PPP > Secrets > Password','Falha 1: senha diferente da do cliente; veja o log com /log print'],['BNG: /ppp secret set cliente1 password=senha123','BNG: PPP > Secrets > Password','Corrige a Falha 1'],['BNG: /ppp secret disable cliente1','BNG: Botão Disable','Falha 2: secret desativada; derrube a sessão com /ppp active remove [find name=cliente1]'],['BNG: /ppp secret enable cliente1','BNG: Botão Enable','Corrige a Falha 2'],['CLIENTE: /interface pppoe-client set pppoe-out1 allow=pap','CLIENTE: PPP > Interface > pppoe-out1 > Dial Out','Falha 3: o cliente só aceita PAP, mas o BNG só aceita chap e mschap2'],['CLIENTE: /interface pppoe-client set pppoe-out1 allow=pap,chap,mschap1,mschap2','CLIENTE: PPP > Interface > pppoe-out1 > Dial Out','Corrige a Falha 3']],x:'Falha 1: o log mostra falha de autenticação. Falha 2: o cliente não reconecta depois de derrubado. Falha 3: a sessão não sobe por incompatibilidade de método. Depois de cada correção, o pppoe-out1 volta a Running.'}],
 gab:{cisco:`<h4>BNG</h4><pre class='gb'>/system identity set name=BNG
/ip dhcp-client add interface=ether1 disabled=no
/ip dns set servers=8.8.8.8 allow-remote-requests=yes
/ip firewall nat add chain=srcnat out-interface=ether1 action=masquerade
/ip pool add name=pool-pppoe ranges=172.16.0.10-172.16.0.250
/ppp profile add name=plano-10M local-address=172.16.0.1 remote-address=pool-pppoe rate-limit=10M/10M dns-server=8.8.8.8
/ppp profile add name=plano-50M local-address=172.16.0.1 remote-address=pool-pppoe rate-limit=50M/50M dns-server=8.8.8.8
/ppp secret add name=cliente1 password=senha123 service=pppoe profile=plano-50M
/interface pppoe-server server add service-name=provedor interface=ether2 default-profile=plano-10M authentication=chap,mschap2 disabled=no
/ip firewall filter add chain=input connection-state=established,related action=accept
/ip firewall filter add chain=input connection-state=invalid action=drop
/ip firewall filter add chain=input in-interface=ether1 protocol=tcp dst-port=22,8291 action=accept
/ip firewall filter add chain=input in-interface=ether1 action=drop</pre><h4>CLIENTE</h4><pre class='gb'>/system identity set name=CLIENTE
/interface pppoe-client add name=pppoe-out1 interface=ether1 user=cliente1 password=senha123 add-default-route=yes use-peer-dns=yes disabled=no
/ip address add address=192.168.10.1/24 interface=ether2
/ip firewall nat add chain=srcnat out-interface=pppoe-out1 action=masquerade
/ip firewall mangle add chain=forward protocol=tcp tcp-flags=syn out-interface=pppoe-out1 action=change-mss new-mss=clamp-to-pmtu passthrough=yes</pre>`,huawei:`<p>No Winbox, use os mesmos valores do terminal, digitados nos menus indicados na segunda coluna de cada passo. Resumo dos valores finais:</p><table><tr><th>Equipamento</th><th>Menu</th><th>Valor</th></tr><tr><td>BNG</td><td>IP > Pool</td><td>pool-pppoe, 172.16.0.10 a 172.16.0.250</td></tr><tr><td>BNG</td><td>PPP > Profiles</td><td>plano-10M e plano-50M (local 172.16.0.1, pool-pppoe, rate-limit)</td></tr><tr><td>BNG</td><td>PPP > Secrets</td><td>cliente1 / senha123 / plano-50M</td></tr><tr><td>BNG</td><td>PPP > PPPoE Servers</td><td>ether2, service provedor, chap e mschap2</td></tr><tr><td>BNG</td><td>IP > Firewall > NAT</td><td>srcnat masquerade em ether1</td></tr><tr><td>CLIENTE</td><td>PPP > Interface > PPPoE Client</td><td>pppoe-out1 em ether1, cliente1 / senha123, add default route</td></tr><tr><td>CLIENTE</td><td>IP > Addresses</td><td>192.168.10.1/24 em ether2</td></tr><tr><td>CLIENTE</td><td>IP > Firewall</td><td>NAT masquerade em pppoe-out1 e regra de mangle change-mss</td></tr></table>`}},
 lOld:{v:['RouterOS (terminal)','Winbox (menu)'],about:'Dois MikroTiks (CHR) no PNETLAB: o BNG (concentrador do provedor, ether1 para a internet/NAT e ether2 para o cliente) e o CLIENTE (ether1 para o BNG). Os níveis sobem do básico ao controle de planos e troubleshooting.',topo:[],svg:`<svg viewBox='0 0 560 120' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><line x1='115' y1='55' x2='215' y2='55'/><line x1='345' y1='55' x2='445' y2='55'/><rect x='35' y='33' width='80' height='44' rx='6' fill='var(--ac2)'/><rect x='215' y='33' width='130' height='44' rx='6' fill='var(--ac)'/><rect x='445' y='33' width='80' height='44' rx='6' fill='var(--ac2)'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='75' y='60'>CLIENTE</text><text x='280' y='60' fill='#fff' font-weight='700'>BNG (MikroTik)</text><text x='485' y='60'>Internet (NAT)</text><text x='165' y='45' font-size='10'>ether1 ↔ ether2</text><text x='395' y='45' font-size='10'>ether1</text><text x='280' y='100'>PPPoE entre CLIENTE e BNG</text></g></svg>`,
 s:[{t:'Nível 1 · Básico no BNG (RouterOS)',c:[['/system identity set name=BNG','System > Identity','Nome do roteador'],['/ip dhcp-client add interface=ether1 disabled=no','IP > DHCP Client > +','A ether1 pega IP da nuvem NAT do PNETLAB'],['/ip dns set servers=8.8.8.8 allow-remote-requests=yes','IP > DNS','Define o servidor DNS'],['/ip firewall nat add chain=srcnat out-interface=ether1 action=masquerade','IP > Firewall > NAT > +','NAT masquerade na saída para a internet'],['/ping 8.8.8.8','Tools > Ping','Confirma a saída para a internet']]},
{t:'Nível 2 · Servidor PPPoE no BNG',c:[['/ip pool add name=pool-pppoe ranges=172.16.0.10-172.16.0.250','IP > Pool > +','Faixa de IPs dos clientes'],['/ppp profile add name=plano-10M local-address=172.16.0.1 remote-address=pool-pppoe rate-limit=10M/10M dns-server=8.8.8.8','PPP > Profiles > +','Perfil do plano. No rate-limit, o primeiro valor é o upload do cliente e o segundo o download'],['/ppp secret add name=cliente1 password=senha123 service=pppoe profile=plano-10M','PPP > Secrets > +','Cria o usuário do cliente'],['/interface pppoe-server server add service-name=provedor interface=ether2 default-profile=plano-10M authentication=chap,mschap2 disabled=no','PPP > PPPoE Servers > +','Liga o servidor PPPoE na porta do cliente'],['/ppp active print','PPP > Active Connections','Lista os clientes conectados (vazia por enquanto)']]},
{t:'Nível 3 · Cliente PPPoE',c:[['/interface pppoe-client add name=pppoe-out1 interface=ether1 user=cliente1 password=senha123 add-default-route=yes use-peer-dns=yes disabled=no','PPP > + > PPPoE Client','No CLIENTE: disca pelo ether1 e instala a rota padrão'],['/interface pppoe-client print','PPP > Interface','Veja o status; a flag R indica running'],['/ip address print','IP > Addresses','O IP recebido (172.16.0.x) aparece em pppoe-out1'],['/ip firewall nat add chain=srcnat out-interface=pppoe-out1 action=masquerade','IP > Firewall > NAT > +','NAT da LAN do cliente pela conexão PPPoE'],['/ping 8.8.8.8','Tools > Ping','Teste de ponta a ponta saindo pelo BNG']]},
{t:'Nível 4 · Planos e controle de clientes (no BNG)',c:[['/ppp profile add name=plano-50M local-address=172.16.0.1 remote-address=pool-pppoe rate-limit=50M/50M','PPP > Profiles > +','Cria um segundo plano'],['/ppp secret set cliente1 profile=plano-50M','PPP > Secrets (duplo clique)','Muda o cliente de plano (reconecte para aplicar)'],['/ppp secret add name=cliente2 password=abc123 profile=plano-10M remote-address=172.16.0.100','PPP > Secrets > +','Cliente com IP fixo'],['/ppp secret disable cliente2','Botão Disable na secret','Suspende o cliente (impede nova conexão)'],['/ppp active remove [find name=cliente2]','PPP > Active Connections > Remove','Derruba a sessão ativa agora']]},
{t:'Nível 5 · Segurança, MSS e falhas provocadas',c:[['/ip firewall filter add chain=input connection-state=established,related action=accept','IP > Firewall > Filter > +','Aceita respostas de conexões já abertas'],['/ip firewall filter add chain=input connection-state=invalid action=drop','IP > Firewall > Filter > +','Descarta tráfego inválido'],['/ip firewall filter add chain=input in-interface=ether1 action=drop','IP > Firewall > Filter > +','Bloqueia acesso ao roteador pela WAN. Deixe por último e garanta antes o seu acesso'],['/ip firewall mangle add chain=forward protocol=tcp tcp-flags=syn out-interface=pppoe-out1 action=change-mss new-mss=clamp-to-pmtu passthrough=yes','IP > Firewall > Mangle > +','No CLIENTE: ajusta o MSS para a MTU de 1492'],['/system logging add topics=pppoe,ppp,debug action=memory','System > Logging > +','Ativa o log de depuração do PPPoE (veja com /log print)'],['/ppp secret set cliente1 password=errada','PPP > Secrets','Falha 1: senha errada. O cliente não autentica; leia o log e corrija'],['/ppp secret disable cliente1','Botão Disable','Falha 2: secret desativada. Diagnostique pelo log e reative']]}]},

{id:'rest',n:'Rotas estáticas e padrão',q:1,d:'Como o roteador decide o caminho e como ensinar rotas manualmente, com backup.',
 t:`<div class="card"><h3>1. A tabela de rotas</h3><p>Um roteador olha o <b>IP de destino</b> de cada pacote e consulta a sua <b>tabela de rotas</b>, parecida com uma placa de sinalização: “para chegar na rede X, siga pelo próximo roteador Y, saindo pela interface Z”. Cada rota tem um <b>prefixo</b> (rede/máscara), um <b>next hop</b> (próximo roteador) ou interface de saída, e valores de confiança (AD) e de métrica.</p><table><tr><th>Código (Cisco)</th><th>Origem</th></tr><tr><td>C</td><td>Connected: rede ligada diretamente a uma interface</td></tr><tr><td>L</td><td>Local: o IP /32 da própria interface</td></tr><tr><td>S</td><td>Static: rota configurada à mão</td></tr><tr><td>S*</td><td>Static candidata a rota padrão</td></tr><tr><td>O</td><td>Aprendida por OSPF</td></tr><tr><td>B</td><td>Aprendida por BGP</td></tr></table></div>
<div class="card"><h3>2. Como o roteador escolhe a rota (longest prefix match)</h3><p>Quando várias rotas combinam com o destino, vence a de <b>prefixo mais longo</b>, ou seja, a mais específica. Exemplo: destino <b>10.1.1.5</b>.</p><table><tr><th>Rota</th><th>Combina?</th><th>Escolhida?</th></tr><tr><td>0.0.0.0/0</td><td>Sim</td><td>Não</td></tr><tr><td>10.0.0.0/8</td><td>Sim</td><td>Não</td></tr><tr><td>10.1.0.0/16</td><td>Sim</td><td>Não</td></tr><tr><td>10.1.1.0/24</td><td>Sim</td><td><b>Sim</b> (maior prefixo)</td></tr><tr><td>10.2.0.0/16</td><td>Não</td><td>Não</td></tr></table><div class="tip">Ordem de decisão: 1) maior prefixo; 2) se empatar, menor <b>AD</b> (distância administrativa); 3) se ainda empatar, menor métrica; 4) se tudo igual, usa as duas rotas (balanceamento).</div></div>
<div class="card"><h3>3. Rota estática</h3><p>É uma rota que você escreve manualmente: <b>destino + máscara + por onde ir</b>. Por onde ir pode ser o IP do <b>next hop</b> ou uma interface de saída.</p><ul><li><b>Cisco:</b> <code>ip route 192.168.2.0 255.255.255.0 10.0.12.2</code></li><li><b>Huawei:</b> <code>ip route-static 192.168.2.0 24 10.0.12.2</code></li></ul><p>Em Ethernet, prefira informar o <b>IP do next hop</b>, pois só com interface de saída o roteador precisa fazer ARP para cada destino. Interface de saída faz sentido em enlaces ponto a ponto.</p><table><tr><th>Vantagens</th><th>Desvantagens</th></tr><tr><td>Simples e previsível; não gera tráfego de protocolo; usa pouca CPU</td><td>Manual; não se adapta sozinha a falhas; cresce mal em redes grandes</td></tr></table><p><b>Quando usar:</b> redes pequenas, <b>stub</b> (rede com uma só saída), ligação com clientes (CPE), rotas de backup e controle fino.</p></div>
<div class="card"><h3>4. A regra de ouro: a rota de volta</h3><p>A comunicação é de <b>mão dupla</b>. Para um ping funcionar, o pacote precisa chegar ao destino <b>e</b> a resposta precisa voltar. O erro mais comum de iniciante é configurar a rota de ida e esquecer a de volta: o ping parece “morrer”, mas o pacote chegou e a resposta é que não sabe voltar. Cada roteador no caminho precisa saber chegar nas duas pontas.</p></div>
<div class="card"><h3>5. Rota padrão (0.0.0.0/0)</h3><p>A <b>rota padrão</b> combina com qualquer destino e só é usada quando nenhuma rota mais específica serve. É como dizer: “se não sei, mande para ele”. Na Cisco, aparece como <b>gateway of last resort</b> (código S*).</p><ul><li><b>Cisco:</b> <code>ip route 0.0.0.0 0.0.0.0 10.0.12.2</code></li><li><b>Huawei:</b> <code>ip route-static 0.0.0.0 0 10.0.12.2</code></li></ul><p>É a configuração clássica de cliente e de roteador de borda que sai para a internet. O PC faz o mesmo com o seu <b>gateway padrão</b>. No OSPF, um roteador pode distribuir a padrão aos demais (default-information originate).</p></div>
<div class="card"><h3>6. Distância administrativa (AD) e métrica</h3><p>Quando a mesma rede é aprendida de fontes diferentes, o roteador usa a <b>AD</b>, que mede a confiança na fonte: <b>menor vence</b>. A <b>métrica</b> só compara rotas da mesma fonte.</p><table><tr><th>Origem</th><th>Cisco (AD)</th><th>Huawei (preference)</th></tr><tr><td>Conectada</td><td>0</td><td>0</td></tr><tr><td>Estática</td><td>1</td><td>60</td></tr><tr><td>eBGP</td><td>20</td><td>255</td></tr><tr><td>OSPF interno</td><td>110</td><td>10</td></tr><tr><td>RIP</td><td>120</td><td>100</td></tr><tr><td>iBGP</td><td>200</td><td>255</td></tr></table><div class="tip">Cuidado: os valores são diferentes entre fabricantes. Numa Huawei, o OSPF (10) vence a estática (60); numa Cisco, a estática (1) vence o OSPF (110).</div><p><b>Rota flutuante (floating static):</b> uma estática de backup com AD <b>maior</b> que a da rota principal. Ela fica escondida e só entra na tabela quando a principal some. Ex.: <code>ip route 192.168.2.0 255.255.255.0 10.0.13.2 200</code>.</p></div>
<div class="card"><h3>7. Null0 e blackhole</h3><p>Uma rota para a interface virtual <b>Null0</b> descarta o tráfego (blackhole). Serve para evitar loops quando se sumariza, por exemplo: <code>ip route 10.0.0.0 255.0.0.0 null0</code> (Huawei: <code>ip route-static 10.0.0.0 8 NULL0</code>). Rotas mais específicas continuam valendo, e só o que não tem destino real vai para o buraco.</p></div>
<div class="card"><h3>8. Detalhes importantes</h3><ul><li><b>Next hop recursivo:</b> o roteador precisa ter rota para o próprio next hop. Se ele não está alcançável, a rota não é instalada.</li><li><b>Balanceamento (ECMP):</b> duas rotas estáticas com mesmo destino e mesma AD são usadas juntas.</li><li><b>IPv6:</b> <code>ipv6 route 2001:db8:2::/64 2001:db8:12::2</code> (Cisco, com <code>ipv6 unicast-routing</code>); <code>ipv6 route-static 2001:db8:2:: 64 2001:db8:12::2</code> (Huawei).</li></ul></div>
<div class="card"><h3>9. Lendo uma linha da tabela</h3><p><code>S    192.168.2.0/24 [1/0] via 10.0.12.2</code></p><table><tr><th>Trecho</th><th>Significado</th></tr><tr><td>S</td><td>Rota estática</td></tr><tr><td>192.168.2.0/24</td><td>Rede de destino</td></tr><tr><td>[1/0]</td><td>[AD / métrica]</td></tr><tr><td>via 10.0.12.2</td><td>Next hop</td></tr></table></div>
<div class="card"><h3>10. Troubleshooting de rotas no NOC</h3><ol><li>O host tem IP, máscara e gateway corretos?</li><li>Cada roteador no caminho tem rota de <b>ida</b>?</li><li>E de <b>volta</b>, até a origem?</li><li>O next hop está alcançável (ping nele)?</li><li>A máscara do destino está correta?</li><li>Existe uma rota mais específica ou de menor AD desviando o tráfego?</li><li>Há ACL ou firewall bloqueando?</li></ol><div class="tip">Use <b>traceroute</b>: o último salto que responde mostra até onde o pacote chega; o problema está nesse roteador ou no próximo trecho. Use ping com <b>source</b> (origem) na interface certa para testar a volta.</div></div>`,
 l:{about:'Três roteadores em linha, com um PC em cada ponta e um enlace de backup entre o R1 e o R3. Os níveis sobem de endereçamento até rotas estáticas de ida e volta, rota padrão, backup com rota flutuante, Null0 e falhas provocadas.',topo:[],svg:`<svg viewBox='0 0 560 190' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><line x1='60' y1='70' x2='122' y2='70'/><line x1='178' y1='70' x2='262' y2='70'/><line x1='318' y1='70' x2='402' y2='70'/><line x1='458' y1='70' x2='500' y2='70'/><path d='M150 98 Q 290 175 430 98' fill='none' stroke-dasharray='6 5'/><circle cx='150' cy='70' r='28' fill='var(--ac2)'/><circle cx='290' cy='70' r='28' fill='var(--ac2)'/><circle cx='430' cy='70' r='28' fill='var(--ac2)'/><rect x='5' y='52' width='55' height='36' rx='6' fill='none'/><rect x='500' y='52' width='55' height='36' rx='6' fill='none'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='150' y='75' font-weight='700'>R1</text><text x='290' y='75' font-weight='700'>R2</text><text x='430' y='75' font-weight='700'>R3</text><text x='32' y='75'>PC1</text><text x='527' y='75'>PC2</text><text x='220' y='58' font-size='10'>10.0.12.0/30</text><text x='360' y='58' font-size='10'>10.0.23.0/30</text><text x='290' y='160' font-size='11'>backup R1–R3 10.0.13.0/30</text></g></svg>`,
 pre:`<ul><li><b>Equipamentos:</b> 3 roteadores (Cisco CSR1000v ou IOSv; Huawei AR) e 2 PCs (VPCS). O R1 e o R3 precisam de 3 interfaces; o R2, de 2. Tempo estimado: cerca de 60 minutos.</li></ul><div class="tip" style="border-left-color:var(--er)"><b>Atenção:</b> se algum roteador da sua imagem tiver menos interfaces, pule o enlace de backup (nível 4). O primeiro ping de um PC costuma falhar enquanto o ARP é resolvido: repita.</div><table><tr><th>Ligação</th><th>Porta A</th><th>Porta B</th></tr><tr><td>PC1 ↔ R1</td><td>R1 g0/0</td><td>PC1</td></tr><tr><td>R1 ↔ R2</td><td>R1 g0/1</td><td>R2 g0/0</td></tr><tr><td>R2 ↔ R3</td><td>R2 g0/1</td><td>R3 g0/0</td></tr><tr><td>R3 ↔ PC2</td><td>R3 g0/1</td><td>PC2</td></tr><tr><td>R1 ↔ R3 (backup)</td><td>R1 g0/2</td><td>R3 g0/2</td></tr></table><table><tr><th>Equipamento</th><th>Interface</th><th>Endereço</th></tr><tr><td>PC1</td><td>—</td><td>192.168.1.10/24 · gw 192.168.1.1</td></tr><tr><td>R1</td><td>g0/0 · g0/1 · g0/2</td><td>192.168.1.1/24 · 10.0.12.1/30 · 10.0.13.1/30</td></tr><tr><td>R2</td><td>g0/0 · g0/1</td><td>10.0.12.2/30 · 10.0.23.1/30</td></tr><tr><td>R3</td><td>g0/0 · g0/1 · g0/2 · Lo0</td><td>10.0.23.2/30 · 192.168.2.1/24 · 10.0.13.2/30 · 8.8.8.8/32</td></tr><tr><td>PC2</td><td>—</td><td>192.168.2.10/24 · gw 192.168.2.1</td></tr></table><p>Nos roteadores Huawei, g0/0 é GigabitEthernet0/0/0 e assim por diante. <b>Como zerar:</b> Cisco <code>write erase</code> e <code>reload</code>; Huawei <code>reset saved-configuration</code> e <code>reboot</code>. Cada passo indica o equipamento no título; o <b>gabarito</b> traz a configuração completa dos três roteadores.</p>`,
 s:[{t:'Nível 1 · PCs: IP e gateway (VPCS)',c:[['PC1> ip 192.168.1.10/24 192.168.1.1','PC1> ip 192.168.1.10/24 192.168.1.1','IP, máscara e gateway do PC1'],['PC2> ip 192.168.2.10/24 192.168.2.1','PC2> ip 192.168.2.10/24 192.168.2.1','IP, máscara e gateway do PC2']]},
{t:'Nível 1 · R1: nome e endereços',w:'Os nomes das interfaces variam por imagem: g0/0 pode ser GigabitEthernet0/0 ou Ethernet0/0. Confira com show ip interface brief (display ip interface brief). Na Huawei, as portas costumam já vir ativas: o undo shutdown só é necessário se estiverem desligadas.',c:[['hostname R1','sysname R1','Nome do roteador'],['interface g0/0','interface GigabitEthernet0/0/0','Interface da LAN A'],['ip address 192.168.1.1 255.255.255.0','ip address 192.168.1.1 24','Gateway do PC1'],['no shutdown','undo shutdown','Ativa a interface'],['interface g0/1','interface GigabitEthernet0/0/1','Interface que liga ao R2'],['ip address 10.0.12.1 255.255.255.252','ip address 10.0.12.1 30','IP /30 do enlace R1–R2'],['no shutdown','undo shutdown','Ativa a interface']]},
{t:'Nível 1 · R2: nome e endereços',c:[['hostname R2','sysname R2','Nome do roteador'],['interface g0/0','interface GigabitEthernet0/0/0','Interface que liga ao R1'],['ip address 10.0.12.2 255.255.255.252','ip address 10.0.12.2 30','IP /30 do enlace R1–R2 (lado do R2)'],['no shutdown','undo shutdown','Ativa a interface'],['interface g0/1','interface GigabitEthernet0/0/1','Interface que liga ao R3'],['ip address 10.0.23.1 255.255.255.252','ip address 10.0.23.1 30','IP /30 do enlace R2–R3'],['no shutdown','undo shutdown','Ativa a interface']]},
{t:'Nível 1 · R3: nome e endereços',c:[['hostname R3','sysname R3','Nome do roteador'],['interface g0/0','interface GigabitEthernet0/0/0','Interface que liga ao R2'],['ip address 10.0.23.2 255.255.255.252','ip address 10.0.23.2 30','IP /30 do enlace R2–R3 (lado do R3)'],['no shutdown','undo shutdown','Ativa a interface'],['interface g0/1','interface GigabitEthernet0/0/1','Interface da LAN B'],['ip address 192.168.2.1 255.255.255.0','ip address 192.168.2.1 24','Gateway do PC2'],['no shutdown','undo shutdown','Ativa a interface']]},
{t:'Nível 1 · R1: verificar',c:[['show ip interface brief','display ip interface brief','Interfaces com IP e estado'],['ping 10.0.12.2','ping 10.0.12.2','Testa o vizinho direto (R2)'],['show ip route','display ip routing-table','Mostra as rotas conectadas (C) e locais (L)']],x:'As interfaces g0/0 e g0/1 aparecem up/up. O ping ao 10.0.12.2 responde. A tabela de rotas tem apenas rotas C e L (192.168.1.0/24 e 10.0.12.0/30): ainda não há rota para as redes distantes, por isso o PC1 não alcança o PC2.'},
{t:'Nível 2 · R1: rota para a LAN B',w:'Rota estática precisa existir de ida e de volta, em cada roteador do caminho. Se faltar uma só, o ping vai e não volta. Na Huawei, o comando aceita a máscara ou o prefixo (24).',c:[['ip route 192.168.2.0 255.255.255.0 10.0.12.2','ip route-static 192.168.2.0 24 10.0.12.2','R1: para chegar à LAN B, o próximo salto é o R2']]},
{t:'Nível 2 · R2: rotas para as duas LANs',c:[['ip route 192.168.2.0 255.255.255.0 10.0.23.2','ip route-static 192.168.2.0 24 10.0.23.2','R2: para a LAN B, o próximo salto é o R3'],['ip route 192.168.1.0 255.255.255.0 10.0.12.1','ip route-static 192.168.1.0 24 10.0.12.1','R2: para a LAN A, o próximo salto é o R1 (rota de volta)']]},
{t:'Nível 2 · R3: rota de volta para a LAN A',c:[['ip route 192.168.1.0 255.255.255.0 10.0.23.1','ip route-static 192.168.1.0 24 10.0.23.1','R3: para a LAN A, o próximo salto é o R2. Sem essa rota, o ping não volta']]},
{t:'Nível 2 · Verificar de ponta a ponta',c:[['PC1> ping 192.168.2.10','PC1> ping 192.168.2.10','Teste do PC1 ao PC2'],['PC1> trace 192.168.2.10','PC1> trace 192.168.2.10','Mostra os saltos até o PC2'],['show ip route static (no R1)','display ip routing-table protocol static (no R1)','Lista as rotas estáticas do R1']],x:'O ping responde (o primeiro pode falhar por causa do ARP). O trace mostra 192.168.1.1, 10.0.12.2 e 10.0.23.2, e depois o PC2. No R1, aparece S 192.168.2.0/24 [1/0] via 10.0.12.2 (na Huawei, preference 60).'},
{t:'Nível 3 · R3: loopback que simula a internet',c:[['interface loopback0','interface LoopBack0','Cria a loopback'],['ip address 8.8.8.8 255.255.255.255','ip address 8.8.8.8 32','Destino que representa a internet']]},
{t:'Nível 3 · R1: rota padrão',w:'A rota padrão só ensina a ir. Para a resposta voltar, o R3 já precisa ter rota para a LAN A (feita no nível 2).',c:[['ip route 0.0.0.0 0.0.0.0 10.0.12.2','ip route-static 0.0.0.0 0 10.0.12.2','R1: tudo que não tem rota mais específica vai para o R2']]},
{t:'Nível 3 · R2: rota padrão',c:[['ip route 0.0.0.0 0.0.0.0 10.0.23.2','ip route-static 0.0.0.0 0 10.0.23.2','R2: tudo que não tem rota mais específica vai para o R3']]},
{t:'Nível 3 · Verificar e experimentar o prefixo mais longo (R1)',w:'Faça o experimento em ordem e restaure a rota no fim. A rota removida é a específica para a LAN B.',c:[['show ip route 8.8.8.8','display ip routing-table 8.8.8.8','Mostra qual rota atende o destino 8.8.8.8'],['PC1> ping 8.8.8.8','PC1> ping 8.8.8.8','Teste do PC1 até a internet simulada'],['no ip route 192.168.2.0 255.255.255.0 10.0.12.2','undo ip route-static 192.168.2.0 24 10.0.12.2','Experimento: remove a rota específica da LAN B'],['show ip route 192.168.2.10','display ip routing-table 192.168.2.10','Agora o destino é atendido pela rota padrão'],['ip route 192.168.2.0 255.255.255.0 10.0.12.2','ip route-static 192.168.2.0 24 10.0.12.2','Restaura a rota específica']],x:'Para 8.8.8.8, o R1 mostra S* 0.0.0.0/0 via 10.0.12.2 (na Huawei, 0.0.0.0/0 Static) e o ping responde. Sem a rota específica, o PC2 ainda é alcançado pela padrão: o prefixo mais longo vence quando existe, e a padrão atende o resto.'},
{t:'Nível 4 · R1: enlace de backup e rota flutuante',w:'Rotas estáticas não percebem falhas distantes: só a perda do enlace local retira a rota. Por isso o teste de falha, mais adiante, desliga os dois lados do caminho principal. Os números 200 (Cisco) e 100 (Huawei) só precisam ser maiores que a AD da rota principal (1 ou 60).',c:[['interface g0/2','interface GigabitEthernet0/0/2','Interface do enlace de backup'],['ip address 10.0.13.1 255.255.255.252','ip address 10.0.13.1 30','IP do enlace R1–R3'],['no shutdown','undo shutdown','Ativa a interface'],['ip route 192.168.2.0 255.255.255.0 10.0.13.2 200','ip route-static 192.168.2.0 24 10.0.13.2 preference 100','Rota flutuante: só entra se a principal sumir']]},
{t:'Nível 4 · R3: enlace de backup e rota de volta flutuante',c:[['interface g0/2','interface GigabitEthernet0/0/2','Interface do enlace de backup'],['ip address 10.0.13.2 255.255.255.252','ip address 10.0.13.2 30','IP do enlace R1–R3 (lado do R3)'],['no shutdown','undo shutdown','Ativa a interface'],['ip route 192.168.1.0 255.255.255.0 10.0.13.1 200','ip route-static 192.168.1.0 24 10.0.13.1 preference 100','Rota de volta flutuante pelo enlace direto']]},
{t:'Nível 4 · Testar a falha do caminho principal',w:'Desligue as duas interfaces: R1 g0/1 e R3 g0/0. Se desligar só uma, o outro lado continua achando que o caminho funciona e o tráfego cai num buraco.',c:[['show ip route 192.168.2.0 (no R1)','display ip routing-table 192.168.2.0 (no R1)','Antes: só a rota principal aparece'],['interface g0/1 / shutdown (no R1)','interface GigabitEthernet0/0/1 / shutdown (no R1)','Derruba o lado do R1 no caminho principal'],['interface g0/0 / shutdown (no R3)','interface GigabitEthernet0/0/0 / shutdown (no R3)','Derruba o lado do R3 no caminho principal'],['show ip route 192.168.2.0 (no R1)','display ip routing-table 192.168.2.0 (no R1)','Depois: a flutuante assume'],['PC1> ping 192.168.2.10','PC1> ping 192.168.2.10','O PC2 continua alcançável, agora pelo enlace direto']],x:'Antes, o R1 mostra S [1/0] via 10.0.12.2. Depois, mostra S [200/0] via 10.0.13.2 (na Huawei, preference 100). O ping do PC1 ao PC2 volta a responder em alguns segundos. Religue as duas interfaces no fim: a rota principal volta sozinha.'},
{t:'Nível 5 · R1: rota para Null0',c:[['ip route 172.16.0.0 255.255.0.0 null0','ip route-static 172.16.0.0 16 NULL0','Descarta tráfego para um bloco sem destino real (blackhole)'],['ping 172.16.1.1','ping 172.16.1.1','Teste: o tráfego é descartado'],['show ip route 172.16.0.0','display ip routing-table 172.16.0.0','Veja a rota apontando para Null0']],x:'O ping para 172.16.1.1 não responde (o tráfego vai para Null0), e a tabela mostra a rota 172.16.0.0/16 com Null0 como saída.'},
{t:'Nível 5 · Falhas provocadas',w:'Faça uma falha de cada vez e corrija antes da próxima. Se você ainda estiver com as interfaces do nível 4 desligadas, religue antes.',c:[['R1: no ip route 192.168.2.0 255.255.255.0 10.0.12.2 / ip route 192.168.2.0 255.255.255.0 10.0.12.3','R1: undo ip route-static 192.168.2.0 24 10.0.12.2 / ip route-static 192.168.2.0 24 10.0.12.3','Falha 1: next hop inexistente. A rota não funciona; ache com show ip route e ping no next hop'],['R3: no ip route 192.168.1.0 255.255.255.0 10.0.23.1','R3: undo ip route-static 192.168.1.0 24 10.0.23.1','Falha 2: remove a rota de volta. O ping vai e não volta'],['PC1> trace 192.168.2.10','PC1> trace 192.168.2.10','Mostra até onde o pacote chega'],['R1: ip route 192.168.2.0 255.255.255.252 10.0.12.2','R1: ip route-static 192.168.2.0 30 10.0.12.2','Falha 3: máscara errada. O PC2 (.10) não está dentro do /30']],x:'Falha 1: o ping falha e o next hop 10.0.12.3 não responde. Falha 2: o trace mostra o R1 e o R2 e depois asteriscos, porque o ICMP do R3 não sabe voltar. Falha 3: a rota existe, mas não cobre o 192.168.2.10 (cai na padrão ou falha). Corrija refazendo o comando original.'}],

{id:'ospf',n:'OSPF',q:1,d:'Roteamento dinâmico link-state: conceitos, laboratório e prova.',
 t:`<div class="card"><h3>O que é</h3><p>OSPF é um protocolo de roteamento <b>link-state</b>: cada roteador descobre vizinhos, troca informações (LSAs) e monta o mesmo mapa da rede. Depois calcula o melhor caminho com o algoritmo SPF (Dijkstra).</p>
<div class="tip">Todo OSPF tem uma <b>área 0</b> (backbone). As demais áreas precisam se conectar a ela.</div></div>
<div class="card"><h3>Conceitos-chave</h3><ul><li><b>Router ID:</b> identificador único (IP de loopback ou configurado).</li><li><b>Hello/Dead:</b> em redes broadcast, 10s e 40s. Os vizinhos precisam combinar timers, área e máscara.</li><li><b>DR/BDR:</b> em redes broadcast (Ethernet), o DR centraliza a troca de LSAs para evitar excesso de adjacências.</li><li><b>Custo:</b> bandwidth de referência / bandwidth da interface (100 Mbps por padrão).</li><li><b>Multicast:</b> 224.0.0.5 (todos os roteadores OSPF) e 224.0.0.6 (DR/BDR).</li></ul></div>
<div class="card"><h3>Estados do vizinho</h3><p>Down → Init → 2-Way → ExStart → Exchange → Loading → <b>Full</b>. Se travou fora de Full, procure erro de timers, área, máscara ou ACL.</p></div><div class="card"><h3>Por que OSPF e como ele funciona</h3><p>Protocolos de <b>vetor de distância</b> (como o RIP) só conhecem o que os vizinhos contam. O OSPF, <b>link-state</b>, dá a cada roteador o mapa completo da área, o que traz convergência rápida, sem laços e com custo configurável. Ele roda direto sobre o IP (protocolo 89), sem TCP nem UDP, e é um padrão aberto, funcionando entre Cisco, Huawei, MikroTik e Datacom.</p><ol><li><b>Descobrir vizinhos</b> com pacotes Hello e formar adjacências.</li><li><b>Trocar LSAs</b> (anúncios de estado de enlace) e montar a mesma <b>LSDB</b> em todos os roteadores da área.</li><li><b>Rodar o SPF</b> (Dijkstra): cada roteador se coloca na raiz da árvore e calcula o caminho de menor custo.</li><li><b>Instalar as melhores rotas</b> na tabela de roteamento.</li></ol><p>Distância administrativa/preferência: <b>110</b> na Cisco; na Huawei, OSPF interno tem preferência <b>10</b> (valores menores vencem).</p></div><div class="card"><h3>Os 5 tipos de pacote</h3><table><tr><th>Pacote</th><th>Função</th></tr><tr><td>Hello</td><td>Descobre e mantém vizinhos; elege DR/BDR</td></tr><tr><td>DBD</td><td>Resume o conteúdo da LSDB (compara bases)</td></tr><tr><td>LSR</td><td>Pede LSAs que faltam</td></tr><tr><td>LSU</td><td>Envia os LSAs completos</td></tr><tr><td>LSAck</td><td>Confirma o recebimento (a entrega é confiável)</td></tr></table></div><div class="card"><h3>Estados da vizinhança e onde ela trava</h3><table><tr><th>Estado</th><th>O que significa</th><th>Se travar aqui</th></tr><tr><td>Down</td><td>Nenhum Hello recebido</td><td>Link, interface ou OSPF não habilitado</td></tr><tr><td>Init</td><td>Recebeu Hello do vizinho, mas ele ainda não viu o seu</td><td>Comunicação em mão única, ACL, multicast bloqueado</td></tr><tr><td>2-Way</td><td>Comunicação bidirecional</td><td>Normal entre dois DROther numa rede broadcast</td></tr><tr><td>ExStart / Exchange</td><td>Define mestre/escravo e troca DBDs</td><td>Clássico: <b>MTU diferente</b> entre os lados</td></tr><tr><td>Loading</td><td>Pede e recebe LSAs que faltam</td><td>Perda de pacotes, LSAs corrompidos</td></tr><tr><td>Full</td><td>LSDBs sincronizadas</td><td>Estado final correto</td></tr></table></div><div class="card"><h3>Requisitos para formar vizinhança</h3><ul><li>Mesma <b>área</b> e mesmo tipo de área no enlace.</li><li>Mesma <b>sub-rede e máscara</b>.</li><li><b>Hello e Dead</b> iguais.</li><li>Autenticação igual, se houver.</li><li><b>Router ID</b> único na rede.</li><li><b>MTU</b> compatível (senão trava em ExStart).</li></ul></div><div class="card"><h3>Router ID</h3><p>Identifica o roteador no OSPF e precisa ser único. Escolha, em ordem: (1) o <b>configurado manualmente</b>, (2) o <b>maior IP de loopback</b>, (3) o maior IP de interface ativa. Boa prática: sempre fixar e usar a loopback. Mudar o router-id exige reiniciar o processo OSPF.</p></div><div class="card"><h3>Tipos de rede, DR e BDR</h3><table><tr><th>Tipo</th><th>Onde aparece</th><th>DR/BDR?</th></tr><tr><td>Broadcast</td><td>Ethernet, switch</td><td>Sim (Hello 10 / Dead 40)</td></tr><tr><td>Ponto a ponto</td><td>Enlace entre 2 roteadores, serial, PPP</td><td>Não</td></tr><tr><td>NBMA / P2MP</td><td>Frame Relay, redes legadas</td><td>Depende</td></tr></table><p>Numa rede broadcast com N roteadores, formar adjacência com todos geraria N×(N−1)/2 relacionamentos. A solução é eleger um <b>DR</b> (e um <b>BDR</b> de reserva); os demais (DROther) só ficam Full com os dois e em 2-Way entre si. Os LSUs vão ao DR por <b>224.0.0.6</b>, e o DR os repassa por 224.0.0.5.</p><div class="tip">A eleição vale pela <b>maior prioridade</b> (padrão 1; prioridade 0 nunca é DR); em empate, vence o <b>maior router-id</b>. A eleição <b>não é preemptiva</b>: quem entra depois com prioridade maior não derruba o DR atual.</div></div><div class="card"><h3>Custo e escolha de caminho</h3><p>O custo de uma interface é <b>bandwidth de referência ÷ bandwidth da interface</b>. Com a referência padrão de 100 Mbps, FastEthernet e Gigabit têm <b>custo 1</b>: o OSPF não distingue as duas. Por isso, em redes modernas, ajusta-se a referência (ex.: 10000) em todos os roteadores. O custo de um caminho é a <b>soma dos custos de saída</b> de cada interface; menor soma vence. Caminhos de custo igual são usados juntos (balanceamento ECMP).</p></div><div class="card"><h3>Áreas, ABR e ASBR</h3><p>Em redes grandes, uma única área faz a LSDB e o SPF crescerem demais. As <b>áreas</b> limitam a propagação: dentro da área todos têm o mapa completo; para fora só chegam resumos. Toda área precisa tocar a <b>área 0</b>.</p><table><tr><th>Papel</th><th>Descrição</th></tr><tr><td>Internal</td><td>Todas as interfaces na mesma área</td></tr><tr><td>Backbone router</td><td>Tem interface na área 0</td></tr><tr><td>ABR</td><td>Liga duas ou mais áreas (uma delas a 0)</td></tr><tr><td>ASBR</td><td>Injeta rotas externas (estáticas, BGP) no OSPF</td></tr></table><table><tr><th>LSA</th><th>Nome</th><th>Quem gera</th></tr><tr><td>1</td><td>Router</td><td>Todo roteador (links dele na área)</td></tr><tr><td>2</td><td>Network</td><td>O DR da rede broadcast</td></tr><tr><td>3</td><td>Summary</td><td>O ABR (rotas de outra área)</td></tr><tr><td>5</td><td>External</td><td>O ASBR (rotas externas)</td></tr></table></div><div class="card"><h3>Checklist de troubleshooting</h3><ol><li>Interface up e IP na mesma sub-rede?</li><li>OSPF habilitado na interface (comando network ou interface)?</li><li>Área, timers, máscara, autenticação e MTU iguais nos dois lados?</li><li>Router ID duplicado?</li><li>Vizinho em Full, mas rota ausente? Verifique a LSDB, filtros e a área.</li><li>Interface marcada como passive (não forma vizinhança)?</li></ol></div>`,
 l:{about:'Triângulo de três roteadores (R1, R2 e R3) na área 0, com níveis crescentes: OSPF entre dois roteadores, fechar o triângulo, custo e escolha de caminho, ajustes finos e segurança, e por fim rota padrão e falhas provocadas.',topo:[],svg:`<svg viewBox='0 0 560 200' width='100%' style='max-width:560px'><g stroke='currentColor' stroke-width='2'><line x1='250' y1='55' x2='140' y2='135'/><line x1='310' y1='55' x2='420' y2='135'/><line x1='170' y1='160' x2='390' y2='160'/><circle cx='280' cy='38' r='26' fill='var(--ac2)'/><circle cx='120' cy='155' r='26' fill='var(--ac2)'/><circle cx='440' cy='155' r='26' fill='var(--ac2)'/></g><g fill='currentColor' font-size='12' text-anchor='middle'><text x='280' y='43' font-weight='700'>R1</text><text x='120' y='160' font-weight='700'>R2</text><text x='440' y='160' font-weight='700'>R3</text><text x='160' y='90' font-size='10'>10.0.12.0/30</text><text x='400' y='90' font-size='10'>10.0.13.0/30</text><text x='280' y='180' font-size='10'>10.0.23.0/30</text></g></svg>`,
 pre:`<ul><li><b>Equipamentos (3):</b> R1, R2 e R3. Cisco: CSR1000v ou IOSv; Huawei: AR ou NE virtual. Cada roteador precisa de pelo menos 2 interfaces Ethernet.</li><li><b>Tempo estimado:</b> cerca de 60 minutos.</li></ul><table><tr><th>Ligação</th><th>Interface A</th><th>Interface B</th></tr><tr><td>R1 ↔ R2</td><td>R1 g0/0</td><td>R2 g0/0</td></tr><tr><td>R1 ↔ R3</td><td>R1 g0/1</td><td>R3 g0/0</td></tr><tr><td>R2 ↔ R3</td><td>R2 g0/1</td><td>R3 g0/1</td></tr></table><table><tr><th>Equipamento</th><th>Loopback0</th><th>Enlaces</th></tr><tr><td>R1</td><td>1.1.1.1/32</td><td>g0/0 10.0.12.1/30 · g0/1 10.0.13.1/30</td></tr><tr><td>R2</td><td>2.2.2.2/32</td><td>g0/0 10.0.12.2/30 · g0/1 10.0.23.1/30</td></tr><tr><td>R3</td><td>3.3.3.3/32</td><td>g0/0 10.0.13.2/30 · g0/1 10.0.23.2/30</td></tr></table><p>Nos equipamentos Huawei, g0/0 e g0/1 correspondem a GigabitEthernet0/0/0 e 0/0/1. <b>Como zerar:</b> Cisco <code>write erase</code> e <code>reload</code>; Huawei <code>reset saved-configuration</code> e <code>reboot</code>. Cada passo diz em qual equipamento digitar: confira o título. O <b>gabarito</b> no fim traz a configuração completa de cada roteador.</p>`,
 s:[{t:'Nível 1 · R1: nome e endereços',w:'Os nomes das interfaces mudam conforme a imagem: g0/0 pode ser Ethernet0/0 ou GigabitEthernet0/0/0 (Huawei). Use show ip interface brief (display ip interface brief) para ver os nomes reais antes de digitar. Em equipamentos Huawei, as portas costumam já vir ativas: o undo shutdown só é necessário se estiverem desligadas.',c:[['hostname R1','sysname R1','Nome do equipamento'],['interface loopback0','interface LoopBack0','Cria a loopback (interface sempre ativa, usada como Router ID)'],['ip address 1.1.1.1 255.255.255.255','ip address 1.1.1.1 32','IP /32 da loopback'],['interface g0/0','interface GigabitEthernet0/0/0','Entra na interface que liga ao R2'],['ip address 10.0.12.1 255.255.255.252','ip address 10.0.12.1 30','IP /30 do enlace R1–R2'],['no shutdown','undo shutdown','Ativa a interface (na Huawei, costuma já vir ativa)']]},
{t:'Nível 1 · R2: nome e endereços',c:[['hostname R2','sysname R2','Nome do equipamento'],['interface loopback0','interface LoopBack0','Cria a loopback'],['ip address 2.2.2.2 255.255.255.255','ip address 2.2.2.2 32','IP /32 da loopback do R2'],['interface g0/0','interface GigabitEthernet0/0/0','Entra na interface que liga ao R1'],['ip address 10.0.12.2 255.255.255.252','ip address 10.0.12.2 30','IP /30 do enlace R1–R2 (lado do R2)'],['no shutdown','undo shutdown','Ativa a interface']],x:'Ping do R1 ao 10.0.12.2 responde. Se falhar, confira o cabo (g0/0 com g0/0) e o estado das interfaces (show ip interface brief ou display ip interface brief).'},
{t:'Nível 1 · R1: ativar o OSPF',w:'No OSPF, o comando network usa wildcard (0.0.0.3), não a máscara. Na Huawei, os comandos area e network ficam dentro do processo ospf 1, e a sintaxe pode variar um pouco entre versões do VRP. Se o seu equipamento não aceitar o router-id na mesma linha do ospf 1, use o comando router-id separado.',c:[['router ospf 1','ospf 1 router-id 1.1.1.1','Cria o processo OSPF. Na Huawei, o mesmo comando já fixa o Router ID'],['router-id 1.1.1.1','(já feito na linha anterior)','Fixa o Router ID na Cisco'],['(a área vai em cada network)','area 0','Huawei: entra na área 0. Cisco: a área é escrita em cada comando network'],['network 1.1.1.1 0.0.0.0 area 0','network 1.1.1.1 0.0.0.0','Anuncia a loopback na área 0'],['network 10.0.12.0 0.0.0.3 area 0','network 10.0.12.0 0.0.0.3','Anuncia o enlace R1–R2 (wildcard 0.0.0.3 = /30)']]},
{t:'Nível 1 · R2: ativar o OSPF',c:[['router ospf 1','ospf 1 router-id 2.2.2.2','Cria o processo OSPF do R2'],['router-id 2.2.2.2','(já feito na linha anterior)','Fixa o Router ID'],['(a área vai em cada network)','area 0','Huawei: entra na área 0'],['network 2.2.2.2 0.0.0.0 area 0','network 2.2.2.2 0.0.0.0','Anuncia a loopback do R2'],['network 10.0.12.0 0.0.0.3 area 0','network 10.0.12.0 0.0.0.3','Anuncia o enlace R1–R2']]},
{t:'Nível 1 · R1: verificar',c:[['show ip ospf neighbor','display ospf peer brief','Lista os vizinhos OSPF e o estado'],['show ip route ospf','display ip routing-table protocol ospf','Lista as rotas aprendidas pelo OSPF'],['ping 2.2.2.2 source loopback0','ping -a 1.1.1.1 2.2.2.2','Testa a conectividade entre as loopbacks']],x:'O vizinho 2.2.2.2 aparece no estado FULL (com DR ou BDR, pois o enlace é Ethernet). A tabela de rotas tem 2.2.2.2/32 como rota OSPF (O). O ping responde 5 de 5.'},
{t:'Nível 2 · R1: enlace para o R3',c:[['interface g0/1','interface GigabitEthernet0/0/1','Entra na interface que liga ao R3'],['ip address 10.0.13.1 255.255.255.252','ip address 10.0.13.1 30','IP /30 do enlace R1–R3'],['no shutdown','undo shutdown','Ativa a interface'],['router ospf 1','ospf 1','Volta ao processo OSPF'],['(a área vai em cada network)','area 0','Huawei: entra na área 0'],['network 10.0.13.0 0.0.0.3 area 0','network 10.0.13.0 0.0.0.3','Anuncia o novo enlace']]},
{t:'Nível 2 · R2: enlace para o R3',c:[['interface g0/1','interface GigabitEthernet0/0/1','Entra na interface que liga ao R3'],['ip address 10.0.23.1 255.255.255.252','ip address 10.0.23.1 30','IP /30 do enlace R2–R3'],['no shutdown','undo shutdown','Ativa a interface'],['router ospf 1','ospf 1','Volta ao processo OSPF'],['(a área vai em cada network)','area 0','Huawei: entra na área 0'],['network 10.0.23.0 0.0.0.3 area 0','network 10.0.23.0 0.0.0.3','Anuncia o enlace R2–R3']]},
{t:'Nível 2 · R3: configuração completa',w:'Confira se o R3 usou os IPs da tabela: 10.0.13.2 no g0/0 e 10.0.23.2 no g0/1. Um IP trocado derruba a vizinhança sem um aviso claro. Com o triângulo fechado, o R1 passa a usar o enlace direto para o R3, que tem menor custo.',c:[['hostname R3','sysname R3','Nome do equipamento'],['interface loopback0','interface LoopBack0','Cria a loopback'],['ip address 3.3.3.3 255.255.255.255','ip address 3.3.3.3 32','IP /32 da loopback do R3'],['interface g0/0','interface GigabitEthernet0/0/0','Interface que liga ao R1'],['ip address 10.0.13.2 255.255.255.252','ip address 10.0.13.2 30','IP do enlace R1–R3 (lado do R3)'],['no shutdown','undo shutdown','Ativa'],['interface g0/1','interface GigabitEthernet0/0/1','Interface que liga ao R2'],['ip address 10.0.23.2 255.255.255.252','ip address 10.0.23.2 30','IP do enlace R2–R3 (lado do R3)'],['no shutdown','undo shutdown','Ativa'],['router ospf 1','ospf 1 router-id 3.3.3.3','Cria o OSPF (Huawei já fixa o Router ID)'],['router-id 3.3.3.3','(já feito)','Fixa o Router ID'],['(a área vai em cada network)','area 0','Huawei: entra na área 0'],['network 3.3.3.3 0.0.0.0 area 0','network 3.3.3.3 0.0.0.0','Anuncia a loopback'],['network 10.0.13.0 0.0.0.3 area 0','network 10.0.13.0 0.0.0.3','Anuncia o enlace com o R1'],['network 10.0.23.0 0.0.0.3 area 0','network 10.0.23.0 0.0.0.3','Anuncia o enlace com o R2']],x:'No R1, show ip ospf neighbor mostra dois vizinhos em FULL (2.2.2.2 e 3.3.3.3). show ip route 3.3.3.3 (ou display ip routing-table 3.3.3.3) mostra o caminho direto pelo 10.0.13.2. O ping 3.3.3.3 a partir da loopback do R1 responde.'},
{t:'Nível 3 · R1: custo e escolha de caminho',w:'A referência de banda precisa ser a mesma em todos os roteadores, senão os custos ficam incoerentes. Na Huawei, o valor do bandwidth-reference é em Mbit/s. O custo manual de 50 só vale no sentido de saída do R1: o tráfego de volta (R3 para R1) ainda pode usar o enlace direto, gerando caminhos assimétricos. Isso é normal.',c:[['show ip ospf interface g0/1','display ospf interface GigabitEthernet0/0/1','Mostra o custo atual do enlace R1–R3 (anote o valor)'],['router ospf 1','ospf 1','Entra no processo OSPF'],['auto-cost reference-bandwidth 10000','bandwidth-reference 10000','Referência de 10 Gbps: Gigabit passa a ter custo 10 em vez de 1'],['interface g0/1','interface GigabitEthernet0/0/1','Entra na interface para o R3'],['ip ospf cost 50','ospf cost 50','Força um custo alto no enlace direto para o R3'],['traceroute 3.3.3.3','tracert -a 1.1.1.1 3.3.3.3','Mostra o caminho até o R3']]},
{t:'Nível 3 · R2 e R3: mesma referência de banda',c:[['router ospf 1 (no R2)','ospf 1 (no R2)','Entra no processo OSPF do R2'],['auto-cost reference-bandwidth 10000','bandwidth-reference 10000','R2: mesma referência de banda do R1'],['router ospf 1 (no R3)','ospf 1 (no R3)','Entra no processo OSPF do R3'],['auto-cost reference-bandwidth 10000','bandwidth-reference 10000','R3: mesma referência. Use o mesmo valor em todos os roteadores']],x:'Depois de ajustar tudo, o traceroute do R1 para 3.3.3.3 passa pelo R2 (10.0.12.2), porque o caminho via R2 custa 10 + 10 = 20 e o direto custa 50. O show ip route 3.3.3.3 mostra o custo 21 (Cisco).'},
{t:'Nível 4 · R1: passive, timers e autenticação',w:'Mudar timers e autenticação em um lado só derruba a vizinhança até o outro lado ser configurado (veja o passo seguinte). O algoritmo de autenticação e a sintaxe variam com a versão: na Huawei, o md5 pode estar desabilitado ou exigir hmac-sha256 em versões novas. Se o comando for recusado, veja as opções com ? depois de ospf authentication-mode.',c:[['router ospf 1','ospf 1','Entra no processo OSPF'],['passive-interface loopback0','silent-interface LoopBack0','Loopback anunciada, mas sem enviar Hello nela'],['interface g0/0','interface GigabitEthernet0/0/0','Interface para o R2'],['ip ospf hello-interval 5','ospf timer hello 5','Hello a cada 5 segundos'],['ip ospf dead-interval 20','ospf timer dead 20','Dead de 20 s (4 vezes o Hello)'],['ip ospf authentication message-digest','(a autenticação está na linha seguinte)','Cisco: liga a autenticação MD5 na interface'],['ip ospf message-digest-key 1 md5 SENHA123','ospf authentication-mode md5 1 cipher SENHA123','Chave e senha (ID 1). Use a mesma nos dois lados']],x:'Logo depois de aplicar só no R1, o vizinho R2 cai (show ip ospf neighbor fica vazio após o dead time). Esse é o comportamento esperado: os dois lados precisam ser iguais.'},
{t:'Nível 4 · R2: mesmos parâmetros no g0/0',c:[['interface g0/0','interface GigabitEthernet0/0/0','Interface para o R1'],['ip ospf hello-interval 5','ospf timer hello 5','Mesmo Hello do R1'],['ip ospf dead-interval 20','ospf timer dead 20','Mesmo Dead do R1'],['ip ospf authentication message-digest','(a autenticação está na linha seguinte)','Liga a autenticação MD5 (Cisco)'],['ip ospf message-digest-key 1 md5 SENHA123','ospf authentication-mode md5 1 cipher SENHA123','Mesma chave e senha do R1']],x:'O vizinho R1 volta ao estado FULL em até 20 segundos. O R3 não foi alterado, pois a autenticação é por enlace.'},
{t:'Nível 5 · R1: rota padrão via OSPF',w:'O parâmetro always anuncia a rota padrão mesmo sem uma saída real. Em produção, use sem always, para anunciar só quando existir uma rota padrão de verdade. Aqui usamos Null0 apenas para simular a saída.',c:[['ip route 0.0.0.0 0.0.0.0 null0','ip route-static 0.0.0.0 0 NULL0','Cria uma rota padrão local (saída simulada)'],['router ospf 1','ospf 1','Entra no processo OSPF'],['default-information originate always','default-route-advertise always','Anuncia a rota padrão aos demais roteadores'],['show ip route ospf (no R2 e no R3)','display ip routing-table protocol ospf (no R2 e no R3)','Confere a chegada da rota padrão']],x:'No R2 e no R3 aparece a rota 0.0.0.0/0 marcada como O*E2 (Cisco), vinda do R1.'},
{t:'Nível 5 · Falhas provocadas (no R2)',w:'Faça uma falha de cada vez e corrija antes da próxima. Na Huawei, o comando undo network precisa ser digitado dentro da área (ospf 1, depois area 0). O resultado só faz sentido se os passos anteriores estiverem corretos.',c:[['interface g0/0 / ip ospf hello-interval 7','interface GigabitEthernet0/0/0 / ospf timer hello 7','Falha 1: Hello diferente do R1. A vizinhança cai; diagnostique'],['show ip ospf interface g0/0','display ospf interface GigabitEthernet0/0/0','Compare os timers dos dois lados'],['interface g0/0 / ip ospf hello-interval 5','interface GigabitEthernet0/0/0 / ospf timer hello 5','Corrige a Falha 1'],['router ospf 1 / no network 2.2.2.2 0.0.0.0 area 0','ospf 1 / area 0 / undo network 2.2.2.2 0.0.0.0','Falha 2: loopback fora do OSPF. O R1 e o R3 perdem a rota para 2.2.2.2'],['interface g0/1 / shutdown (no R1)','interface GigabitEthernet0/0/1 / shutdown (no R1)','Falha 3: o enlace R1–R3 cai. Observe a convergência pelo R2 com ping contínuo']],x:'Cada falha tem um sintoma claro: vizinho ausente (Falha 1), rota sumida (Falha 2) e rota alternativa assumindo (Falha 3). Corrija desfazendo o comando e confira com show ip ospf neighbor.'}],
 gab:{cisco:`<h4>R1</h4><pre class='gb'>hostname R1
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 SENHA123
 ip ospf hello-interval 5
 ip ospf dead-interval 20
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.13.1 255.255.255.252
